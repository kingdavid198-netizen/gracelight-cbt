<!DOCTYPE html>
<html>
<head>
<title>Admin Results</title>

<style>

body{
font-family: Arial;
padding:20px;
background:#f5f5f5;
}

h1{
text-align:center;
color:green;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th, td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:green;
color:white;
}

button{
padding:6px 12px;
background:red;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:darkred;
}

</style>

</head>

<body>

<h1>GraceLight CBT Results</h1>

<table>

<thead>

<tr>
<th>Candidate</th>
<th>Subject</th>
<th>Topic</th>
<th>Score</th>
<th>Percentage</th>
<th>Remark</th>
<th>Date</th>
<th>Action</th>
</tr>

</thead>

<tbody id="resultsBody">

</tbody>

</table>

<script>

async function loadResults(){

const response = await fetch("/results");

const results = await response.json();

const body = document.getElementById("resultsBody");

body.innerHTML = "";

results.forEach(result => {

body.innerHTML += `

<tr>

<td>${result.candidate}</td>

<td>${result.subject}</td>

<td>${result.topic}</td>

<td>${result.score}</td>

<td>${result.percentage}%</td>

<td>${result.remark}</td>

<td>${result.date}</td>

<td>
<button onclick="deleteResult('${result._id}')">
Delete
</button>
</td>

</tr>

`;

});

}

async function deleteResult(id){

if(confirm("Delete this result?")){

await fetch("/delete-result/" + id,{
method:"DELETE"
});

loadResults();

}

}

loadResults();

</script>

</body>
</html>
