<!DOCTYPE html>
<html>
<head>
<title>Admin Results</title>

<style>

body{
font-family: Arial;
padding:20px;
background:#f5f5f5;
}

h1{
text-align:center;
color:green;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th, td{
border:1px solid #ccc;
padding:10px;
text-align:center;
}

th{
background:green;
color:white;
}

button{
padding:6px 12px;
background:red;
color:white;
border:none;
cursor:pointer;
}

button:hover{
background:darkred;
}

</style>

</head>

<body>

<h1>GraceLight CBT Results</h1>

<label><input type="checkbox" id="selectAllResults" onchange="toggleAllResults(this.checked)"> Select All</label>
<button type="button" onclick="deleteSelectedResults()">Delete Selected</button>

<table>

<thead>

<tr>
<th>Candidate</th>
<th>Subject</th>
<th>Topic</th>
<th>Score</th>
<th>Percentage</th>
<th>Remark</th>
<th>Date</th>
<th>Action</th>
</tr>

<th>Select</th>
</thead>

<tbody id="resultsBody">

</tbody>

</table>

<script>

async function loadResults(){

const response = await fetch("/results");

const results = await response.json();

const body = document.getElementById("resultsBody");

body.innerHTML = "";

results.forEach(result => {

body.innerHTML += `

<tr>

<td><input type="checkbox" class="result-checkbox" value="${result._id}"></td>
<td>${result.candidate}</td>

<td>${result.subject}</td>

<td>${result.topic}</td>

<td>${result.score}</td>

<td>${result.percentage}%</td>

<td>${result.remark}</td>

<td>${result.date}</td>

<td>
<button onclick="deleteResult('${result._id}')">
Delete
</button>
</td>

</tr>

`;

});

}

async function deleteResult(id){

if(confirm("Delete this result?")){

await fetch("/delete-result/" + id,{
method:"DELETE"
});

loadResults();

}
}

function toggleAllResults(checked){
document.querySelectorAll(".result-checkbox").forEach(checkbox => checkbox.checked = checked);
}

async function deleteSelectedResults(){
const ids = Array.from(document.querySelectorAll(".result-checkbox:checked"))
.map(checkbox => checkbox.value);

if(ids.length === 0){
alert("Select at least one result to delete.");
return;
}

if(!confirm(`Delete ${ids.length} selected results? This cannot be undone.`)) return;

const response = await fetch("/delete-results", {
method:"DELETE",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({ids})
});

const data = await response.json();
if(data.success){
loadResults();
}else{
alert("Error deleting selected results");
}
}

loadResults();

</script>

</body>
</html>
