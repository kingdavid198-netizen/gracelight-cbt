<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraceLight CBT</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#1a237e,#42a5f5);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:15px;
overflow:hidden;
}

.container{
width:100%;
max-width:1000px;
height:92vh;
background:white;
border-radius:25px;
display:flex;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.left{
flex:1;
}

.left img{
width:100%;
height:100%;
object-fit:cover;
}

.right{
flex:1;
padding:30px;
display:flex;
flex-direction:column;
justify-content:center;
text-align:center;
}

.logo{
width:80px;
margin:auto;
margin-bottom:10px;
}

h1{
font-size:60px;
color:#2962ff;
line-height:1;
}

.subtitle{
margin-top:10px;
margin-bottom:25px;
font-size:20px;
color:#666;
}

.btn{
display:block;
width:100%;
padding:16px;
margin-bottom:15px;
border:none;
border-radius:12px;
font-size:20px;
font-weight:bold;
color:white;
cursor:pointer;
transition:0.3s;
}

.btn:hover{
transform:translateY(-2px);
}

.exam{
background:linear-gradient(to right,#2962ff,#4fc3f7);
}

.practice{
background:linear-gradient(to right,#26c6da,#80deea);
}

.result{
background:linear-gradient(to right,#7c4dff,#b388ff);
}

.footer{
margin-top:15px;
font-size:13px;
color:#777;
line-height:1.6;
}

@media(max-width:768px){
  .btn{
    padding:13px;
    margin-bottom:10px;
    font-size:18px;
}
.container{
flex-direction:column;
height:auto;
overflow:visible;
padding-bottom:20px;
}

.left{
height:200px;
}

h1{
font-size:42px;
}

}
</style>
</head>
<body>

<div class="container">

<div class="left">
<img src="index.png">
</div>

<div class="right">

<img src="logo.png" class="logo">

<h1>GraceLight CBT</h1>

<div class="subtitle">
Computer Based Test Portal
</div>

<button class="btn exam" onclick="location.href='login.html'">
🚀 Start Exam
</button>

<button class="btn practice">
📘 Practice
</button>

<button class="btn result"
onclick="location.href='student-result-login.html'">
📊 Check Result
</button>

<a href="admin-login.html">
<button>Admin Login</button>
</a>

<div class="footer">
© 2026 GraceLight Learning Centre, Oda<br>
08077001605<br>
All Rights Reserved
</div>

</div>
</div>

</body>
</html>
