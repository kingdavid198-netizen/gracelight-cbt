<!DOCTYPE html>
<html>
<head>
<title>Student Result</title>

<style>

body{
    font-family:Arial;
    background:#eef2ff;
    padding:5px;
}

.container{
    background:white;
    max-width:900px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h1{
    color:#2563eb;
    text-align:center;
}

.info{
margin-top:10px;
line-height:2;
font-size:18px;
width:350px;
margin-left:60px;
margin-right:auto;
text-align:left;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:center;
}

th{
    background:#2563eb;
    color:white;
}

.score{
    color:green;
    font-weight:bold;
}

.print-btn{
    margin-top:0px;
    padding:12px 20px;
    border:none;
    background:#1e3c72;
    color:white;
    border-radius:8px;
    cursor:pointer;
}

@media print{
.print-btn{
display:none;
}
.no-print{
display:none !important;
}
}

.review-section{
margin-top:30px;
}

.review-title{
font-size:22px;
color:#1e3c72;
margin-bottom:15px;
text-align:center;
}

.review-summary{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:10px;
margin-bottom:20px;
}

@media (max-width:700px){
.review-summary{
grid-template-columns:repeat(2,1fr);
}
}

.review-summary-card{
background:#eef6ff;
border-radius:10px;
padding:12px;
text-align:center;
}

.review-summary-card .label{
font-size:13px;
color:#555;
}

.review-summary-card .value{
font-size:22px;
font-weight:bold;
color:#1e3c72;
}

.review-question{
border:1px solid #e0e0e0;
border-radius:10px;
padding:15px;
margin-bottom:15px;
}

.review-question-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
flex-wrap:wrap;
gap:8px;
}

.review-question-header .qnum{
font-weight:bold;
font-size:16px;
}

.badge{
padding:4px 12px;
border-radius:20px;
font-size:13px;
font-weight:bold;
color:white;
}

.badge.correct{
background:#2b8a3e;
}

.badge.wrong{
background:#c92a2a;
}

.review-question-text{
margin-bottom:10px;
font-size:16px;
text-align:left;
}

.review-question img{
max-width:100%;
height:auto;
border-radius:8px;
margin-bottom:10px;
}

.review-options{
display:flex;
flex-direction:column;
gap:6px;
text-align:left;
}

.review-option{
padding:8px 12px;
border-radius:6px;
border:1px solid #ddd;
font-size:15px;
}

.review-option.selected-wrong{
background:#ffe3e3;
border-color:#c92a2a;
color:#c92a2a;
font-weight:bold;
}

.review-option.correct-answer{
background:#ebfbee;
border-color:#2b8a3e;
color:#2b8a3e;
font-weight:bold;
}

.no-review-note{
text-align:center;
color:#888;
margin-top:20px;
}

.school-header{
text-align:center;
margin-bottom:15px;
}

.school-logo{
width:90px;
height:90px;
object-fit:contain;
margin-bottom:10px;
}

.school-header h1{
color:#2563eb;
margin:0;
font-size:36px;
}

.school-header h3{
margin:5px 0;
color:#555;
font-style:italic;
font-weight:500;
}

.school-header h2{
margin-top:15px;
color:#111827;
font-size:28px;
}

</style>
</head>

<body>

<div class="container">

<div class="school-header">

<img src="logo.png" class="school-logo">

<h1>GraceLight Learning Centre</h1>

<h3>Where Wisdom Meets Purpose</h3>

<div style="display:flex; justify-content:center; align-items:center; gap:15px;">

<img
id="resultPassport"
src="images/passport-placeholder.png"
style="
width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
display:block;
"
/>

<h2 style="margin:0;">CBT RESULT SLIP</h2>

</div>

<div class="info" id="studentInfo">
Loading result...
</div>

<button class="print-btn" onclick="window.print()">
Print Result
</button>

<div class="review-section no-print" id="answerReviewSection"></div>

</div>

<script>

const studentName =
localStorage.getItem("studentSearch");

async function loadStudentResult() {

    try {

        const response = await fetch("/results");
        const allResults = await response.json();

        const student = allResults.find(r =>
            r.candidateName &&
            r.candidateName.toLowerCase().trim() ===
            studentName.toLowerCase().trim()
        );

        if(student){

            document.getElementById("studentInfo").innerHTML = `
                <p><strong>Candidate:</strong>
                ${student.candidateName || "N/A"}</p>

                <p><strong>Subject:</strong>
                ${student.subject || "N/A"}</p>

                <p><strong>Topic:</strong>
                ${student.topic || "N/A"}</p>

                <p><strong>Score:</strong>
                <span class="score">
                ${student.score || 0}/${student.totalQuestions || 0}
                </span></p>

                <p><strong>Percentage:</strong>
                ${student.percentage || 0}%</p>

                <p><strong>Remark:</strong>
                ${student.remark || "N/A"}</p>
            `;

            renderAnswerReview(student);

        } else {

            document.getElementById("studentInfo").innerHTML = `
                <h2 style="color:red;text-align:center;">
                    Result Not Found
                </h2>
            `;
        }

    } catch(error){

        console.log(error);

        document.getElementById("studentInfo").innerHTML = `
            <h2 style="color:red;text-align:center;">
                Error Loading Result
            </h2>
        `;
    }
}

function escapeHtml(value){

    return String(value == null ? "" : value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
}

function renderAnswerReview(student){

    const section =
    document.getElementById("answerReviewSection");

    const review = student.answersReview;

    if(!Array.isArray(review) || review.length === 0){

        section.innerHTML = `
            <p class="no-review-note">
                Answer review not available for this result.
            </p>
        `;

        return;
    }

    const total = review.length;
    const attempted = review.filter(r => r.selected).length;
    const correct = review.filter(r => r.isCorrect).length;
    const wrong = total - correct;
    const percentage =
    student.percentage != null
        ? student.percentage
        : Math.round((correct / total) * 100);

    const summaryHtml = `
        <div class="review-summary">
            <div class="review-summary-card">
                <div class="label">Total Questions</div>
                <div class="value">${total}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Attempted</div>
                <div class="value">${attempted}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Correct</div>
                <div class="value" style="color:#2b8a3e;">${correct}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Wrong</div>
                <div class="value" style="color:#c92a2a;">${wrong}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Score</div>
                <div class="value">${percentage}%</div>
            </div>
        </div>
    `;

    const optionLabels = ["A","B","C","D"];

    const questionsHtml = review.map(r => {

        const options = r.options || {};

        const optionsHtml = optionLabels
            .filter(letter => options[letter] !== undefined && options[letter] !== null && options[letter] !== "")
            .map(letter => {

                let cls = "review-option";

                if(!r.isCorrect && letter === r.selected){
                    cls += " selected-wrong";
                }

                if(letter === r.correctAnswer){
                    cls += " correct-answer";
                }

                return `
                    <div class="${cls}">
                        ${letter}. ${escapeHtml(options[letter])}
                    </div>
                `;

            }).join("");

        return `
            <div class="review-question">
                <div class="review-question-header">
                    <span class="qnum">Question ${r.questionNumber}</span>
                    <span class="badge ${r.isCorrect ? "correct" : "wrong"}">
                        ${r.isCorrect ? "Correct" : "Wrong"}
                    </span>
                </div>

                <div class="review-question-text">
                    ${escapeHtml(r.question)}
                </div>

                ${r.image ? `<img src="${r.image}" alt="Question Image">` : ""}

                <div class="review-options">
                    ${optionsHtml}
                </div>

                <p style="margin-top:8px;font-size:14px;color:#555;">
                    Your answer: <strong>${r.selected || "Not answered"}</strong>
                    &nbsp;|&nbsp;
                    Correct answer: <strong>${r.correctAnswer}</strong>
                </p>
            </div>
        `;

    }).join("");

    section.innerHTML = `
        <div class="review-title">Review of Answers</div>
        ${summaryHtml}
        ${questionsHtml}
    `;

}

loadStudentResult();

const resultPassport =
document.getElementById("resultPassport");

const savedPassport =
localStorage.getItem("candidatePassport");

if(savedPassport && resultPassport){
resultPassport.src = savedPassport;
}

</script>

</body>
</html>
