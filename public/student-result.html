<!DOCTYPE html>
<html>
<head>
<title>CBT Result Slip</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    margin: 0;
    padding: 16px;
    color: #1f2937;
}

.container {
    background: #fff;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.08);
}

.school-header {
    text-align: center;
    margin-bottom: 16px;
}

.school-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    margin-bottom: 10px;
}

.school-header h1 {
    color: #2563eb;
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
}

.school-header h3 {
    margin: 8px 0 16px;
    color: #555;
    font-style: italic;
    font-weight: 500;
}

.identity-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

#resultPassport {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid #dbeafe;
}

.school-header h2 {
    margin: 0;
    color: #111827;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
}

.result-layout {
    display: grid;
    grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
    gap: 20px;
    margin-top: 24px;
}

.history-panel,
.detail-panel {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px;
}

.history-title,
.detail-title {
    margin: 0 0 14px;
    color: #1e3c72;
    font-size: 1.1rem;
    font-weight: 700;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    width: 100%;
    text-align: left;
    border: 1px solid #dbeafe;
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.history-item:hover,
.history-item.active {
    background: #eff6ff;
    border-color: #93c5fd;
    transform: translateY(-1px);
}

.history-item .date {
    display: block;
    font-size: 0.75rem;
    color: #64748b;
    margin-bottom: 6px;
}

.history-item .meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.88rem;
    flex-wrap: wrap;
}

.history-item .score-badge {
    font-weight: 700;
    color: #0f766e;
}

.detail-panel {
    min-width: 0;
}

.info {
    display: grid;
    gap: 10px;
    font-size: 1rem;
    line-height: 1.6;
}

.info p {
    margin: 0;
    padding: 10px 12px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.score {
    color: green;
    font-weight: bold;
}

.print-btn {
    margin-top: 16px;
    padding: 12px 20px;
    border: none;
    background: #1e3c72;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.96rem;
}

.result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

.download-btn {
    margin-top: 16px;
    padding: 12px 20px;
    border: none;
    background: #0f766e;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.96rem;
}

.download-status {
    min-height: 1.2em;
    margin-top: 8px;
    color: #b91c1c;
    font-size: 0.9rem;
}

.review-section {
    margin-top: 24px;
}

.review-title {
    font-size: 1.3rem;
    color: #1e3c72;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 700;
}

.review-summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.review-summary-card {
    background: #eef6ff;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1px solid #dbeafe;
}

.review-summary-card .label {
    font-size: 0.8rem;
    color: #555;
}

.review-summary-card .value {
    font-size: 1.4rem;
    font-weight: bold;
    color: #1e3c72;
    margin-top: 6px;
}

.review-question {
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    background: white;
}

.review-question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
}

.review-question-header .qnum {
    font-weight: bold;
    font-size: 1rem;
}

.badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    color: white;
}

.badge.correct {
    background: #2b8a3e;
}

.badge.wrong {
    background: #c92a2a;
}

.review-question-text {
    margin-bottom: 10px;
    font-size: 1rem;
    text-align: left;
    color: #111827;
}

.review-question img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 10px;
}

.review-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
}

.review-option {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    font-size: 0.95rem;
}

.review-option.selected-wrong {
    background: #ffe3e3;
    border-color: #c92a2a;
    color: #c92a2a;
    font-weight: bold;
}

.review-option.correct-answer {
    background: #ebfbee;
    border-color: #2b8a3e;
    color: #2b8a3e;
    font-weight: bold;
}

.no-review-note {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 16px;
    }

    .result-layout {
        grid-template-columns: 1fr;
    }

    .history-panel,
    .detail-panel {
        padding: 14px;
    }

    .review-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media print {
    @page {
        size: A4;
        margin: 0;
    }

    html,
    body {
        width: 210mm;
        margin: 0;
        padding: 0;
        background: #fff;
        font-size: 9.5pt;
    }

    .container {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 15mm;
        border-radius: 0;
        box-shadow: none;
    }

    .school-header {
        margin-bottom: 8mm;
    }

    .school-logo {
        width: 18mm;
        height: 18mm;
        margin-bottom: 1mm;
    }

    .school-header h1 {
        font-size: 16pt;
    }

    .school-header h3 {
        margin: 1mm 0 2mm;
        font-size: 9pt;
    }

    .school-header h2 {
        font-size: 13pt;
    }

    #resultPassport {
        width: 15mm;
        height: 15mm;
    }

    .result-layout {
        display: block;
        margin: 0 auto;
    }

    .print-btn,
    .download-btn,
    .download-status,
    .history-panel,
    .no-print,
    button,
    nav,
    input,
    select {
        display: none !important;
    }

    .detail-panel {
        min-width: 0;
        max-width: 160mm;
        margin: 0 auto;
        border: 1px solid #d1d5db;
        border-radius: 3mm;
        box-shadow: none;
        padding: 8mm;
        background: #fff;
    }

    .detail-title,
    .result-date {
        display: none !important;
    }

    .info {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3mm;
        font-size: 10pt;
        line-height: 1.35;
    }

    .info p {
        padding: 3mm;
        border-radius: 2mm;
    }

    .review-section {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="school-header">

<img src="logo.png" class="school-logo">

<h1>GraceLight Learning Centre</h1>

<h3>Where Wisdom Meets Purpose</h3>

<div class="identity-row">

<img id="resultPassport" src="images/passport-placeholder.png" />

<h2>CBT RESULT SLIP</h2>

</div>

</div>

<div class="result-layout">

    <aside class="history-panel no-print">
        <h3 class="history-title">Past Attempts</h3>
        <div id="attemptList" class="history-list">
            Loading results...
        </div>
    </aside>

    <main class="detail-panel">
        <h3 class="detail-title">Selected Attempt</h3>
        <div class="info" id="studentInfo">
            Loading result...
        </div>

        <div class="result-actions">
            <button class="print-btn" type="button" onclick="window.print()">Print Result</button>
            <button class="download-btn" id="downloadResultButton" type="button" onclick="downloadSelectedResultPdf()">Download result (PDF)</button>
        </div>
        <p id="downloadStatus" class="download-status" role="status" aria-live="polite"></p>

        <div class="review-section" id="answerReviewSection"></div>
    </main>

</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script>

const studentName = (localStorage.getItem("studentSearch") || "").trim();
let studentHistory = [];
let selectedResultId = null;

function normalizeStudentKey(value) {
    return String(value || "").trim().toLowerCase();
}

function escapeHtml(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

async function loadStudentResult() {
    try {
        const encodedName = encodeURIComponent(normalizeStudentKey(studentName));
        const response = await fetch(`/results/${encodedName}`);
        const results = await response.json();

        studentHistory = Array.isArray(results) ? results : [];

        if (!studentHistory.length) {
            document.getElementById("studentInfo").innerHTML = `
                <h2 style="color:red;text-align:center; margin:0;">
                    Result Not Found
                </h2>
            `;
            document.getElementById("attemptList").innerHTML = "No past attempts found.";
            return;
        }

        selectedResultId = studentHistory[0]._id;
        renderAttemptList();
        renderSelectedResult(studentHistory[0]);
    } catch (error) {
        console.log(error);
        document.getElementById("studentInfo").innerHTML = `
            <h2 style="color:red;text-align:center; margin:0;">
                Error Loading Result
            </h2>
        `;
    }
}

function renderAttemptList() {
    const list = document.getElementById("attemptList");

    list.innerHTML = studentHistory.map(result => {
        const isActive = result._id === selectedResultId ? "active" : "";
        return `
            <button type="button" class="history-item ${isActive}" data-result-id="${result._id}">
                <span class="date">${result.date || "N/A"}</span>
                <div class="meta">
                    <span>${result.subject || "N/A"}</span>
                    <span class="score-badge">${result.score || 0}/${result.totalQuestions || 0}</span>
                </div>
            </button>
        `;
    }).join("");

    document.querySelectorAll(".history-item").forEach(button => {
        button.addEventListener("click", () => {
            const clickedId = button.dataset.resultId;
            const chosen = studentHistory.find(item => item._id === clickedId);
            if (chosen) {
                selectedResultId = clickedId;
                renderAttemptList();
                renderSelectedResult(chosen);
            }
        });
    });
}

function renderSelectedResult(student) {
    document.getElementById("studentInfo").innerHTML = `
        <p><strong>Candidate:</strong> ${student.candidateName || "N/A"}</p>
        <p><strong>Subject:</strong> ${student.subject || "N/A"}</p>
        <p><strong>Topic:</strong> ${student.topic || "N/A"}</p>
        <p class="result-date"><strong>Date:</strong> ${student.date || "N/A"}</p>
        <p><strong>Score:</strong> <span class="score">${student.score || 0}/${student.totalQuestions || 0}</span></p>
        <p><strong>Percentage:</strong> ${student.percentage || 0}%</p>
        <p><strong>Remark:</strong> ${student.remark || "N/A"}</p>
    `;

    renderAnswerReview(student);
}

function renderAnswerReview(student) {
    const section = document.getElementById("answerReviewSection");

    const review = student.answersReview;

    if (!Array.isArray(review) || review.length === 0) {
        section.innerHTML = `
            <p class="no-review-note">Answer review not available for this attempt.</p>
        `;
        return;
    }

    const total = review.length;
    const attempted = review.filter(r => r.selected).length;
    const correct = review.filter(r => r.isCorrect).length;
    const wrong = total - correct;
    const percentage = student.percentage != null ? student.percentage : Math.round((correct / total) * 100);

    const summaryHtml = `
        <div class="review-summary">
            <div class="review-summary-card">
                <div class="label">Total Questions</div>
                <div class="value">${total}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Attempted</div>
                <div class="value">${attempted}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Correct</div>
                <div class="value" style="color:#2b8a3e;">${correct}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Wrong</div>
                <div class="value" style="color:#c92a2a;">${wrong}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Score</div>
                <div class="value">${percentage}%</div>
            </div>
        </div>
    `;

    const optionLabels = ["A", "B", "C", "D"];

    const questionsHtml = review.map(r => {
        const options = r.options || {};

        const optionsHtml = optionLabels
            .filter(letter => options[letter] !== undefined && options[letter] !== null && options[letter] !== "")
            .map(letter => {
                let cls = "review-option";

                if (!r.isCorrect && letter === r.selected) {
                    cls += " selected-wrong";
                }

                if (letter === r.correctAnswer) {
                    cls += " correct-answer";
                }

                return `<div class="${cls}">${letter}. ${escapeHtml(options[letter])}</div>`;
            }).join("");

        return `
            <div class="review-question">
                <div class="review-question-header">
                    <span class="qnum">Question ${r.questionNumber}</span>
                    <span class="badge ${r.isCorrect ? "correct" : "wrong"}">
                        ${r.isCorrect ? "Correct" : "Wrong"}
                    </span>
                </div>

                <div class="review-question-text">${escapeHtml(r.question)}</div>
                ${r.image ? `<img src="${r.image}" alt="Question Image">` : ""}

                <div class="review-options">${optionsHtml}</div>

                <p style="margin-top:8px;font-size:14px;color:#555;">
                    Your answer: <strong>${r.selected || "Not answered"}</strong>
                    &nbsp;|&nbsp;
                    Correct answer: <strong>${r.correctAnswer}</strong>
                </p>
            </div>
        `;
    }).join("");

    section.innerHTML = `
        <div class="review-title">Review of Answers</div>
        ${summaryHtml}
        ${questionsHtml}
    `;
}

loadStudentResult();

const resultPassport = document.getElementById("resultPassport");
const savedPassport = localStorage.getItem("candidatePassport");

if (savedPassport && resultPassport) {
    resultPassport.src = savedPassport;
}

function pdfText(value) {
    return String(value == null || value === "" ? "N/A" : value)
        .normalize("NFC")
        .replace(/[\u0000-\u001f\u007f-\u009f]/g, " ")
        .replace(/\s+/g, " ")
        .trim() || "N/A";
}

function safePdfFilenamePart(value) {
    const cleaned = pdfText(value)
        .replace(/\s+/g, "_")
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
        .replace(/[. ]+$/g, "")
        .replace(/_+/g, "_");
    return cleaned || "Result";
}

function getLocalImageData(image, allowDataImage = false) {
    if (!image || !image.complete || !image.naturalWidth || !image.naturalHeight) return null;

    const source = image.currentSrc || image.src;
    const isDataImage = /^data:image\/(?:png|jpe?g|webp);base64,/i.test(source);
    if (!isDataImage || !allowDataImage) {
        try {
            if (new URL(source, window.location.href).origin !== window.location.origin) return null;
        } catch (error) {
            return null;
        }
    }

    try {
        const canvas = document.createElement("canvas");
        canvas.width = image.naturalWidth;
        canvas.height = image.naturalHeight;
        const context = canvas.getContext("2d");
        if (!context) return null;
        context.drawImage(image, 0, 0);
        return canvas.toDataURL("image/jpeg", 0.88);
    } catch (error) {
        console.warn("Skipping result photo in PDF:", error);
        return null;
    }
}

function getResultPhotoData() {
    return getLocalImageData(document.getElementById("resultPassport"), true);
}

function createResultPdf(student) {
    const JsPDF = window.jspdf && window.jspdf.jsPDF;
    if (typeof JsPDF !== "function") {
        throw new Error("The PDF library is unavailable. Reload the page and try again.");
    }

    const pdf = new JsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pageWidth = 210;
    const margin = 18;
    const centerX = pageWidth / 2;
    const photo = getResultPhotoData();
    const schoolLogo = getLocalImageData(document.querySelector(".school-logo"));
    const detailWidth = 174;
    const detailX = (pageWidth - detailWidth) / 2;
    const innerPadding = 10;
    const labelWidth = 37;
    const photoSpace = photo ? 25 : 0;
    const valueX = detailX + innerPadding + labelWidth;
    const valueWidth = detailWidth - innerPadding * 2 - labelWidth - photoSpace;
    const rows = [
        ["Candidate", pdfText(student.candidateName)],
        ["Subject", pdfText(student.subject)],
        ["Topic", pdfText(student.topic)],
        ["Score", `${pdfText(student.score)} / ${pdfText(student.totalQuestions)}`],
        ["Percentage", `${pdfText(student.percentage)}%`],
        ["Remark", pdfText(student.remark)]
    ];
    const contentTop = 72;
    const contentBottom = 263;
    let fontSize = 11;
    let rowLayouts;
    let detailsHeight;

    do {
        const lineHeight = fontSize * 0.42;
        rowLayouts = rows.map(([label, value]) => {
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(fontSize);
            const lines = pdf.splitTextToSize(value, valueWidth);
            return {
                label,
                lines,
                lineHeight,
                rowHeight: Math.max(11, lines.length * lineHeight + 5)
            };
        });
        detailsHeight = 14 + rowLayouts.reduce((height, row) => height + row.rowHeight, 0);
        if (detailsHeight <= contentBottom - contentTop || fontSize <= 7) break;
        fontSize -= 1;
    } while (fontSize >= 7);

    if (detailsHeight > contentBottom - contentTop) {
        throw new Error("The selected result has too much text to fit on one A4 page.");
    }

    pdf.setTextColor(31, 41, 55);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(17);
    if (schoolLogo) {
        try {
            pdf.addImage(schoolLogo, "JPEG", centerX - 8, 9, 16, 16, undefined, "FAST");
        } catch (error) {
            console.warn("Skipping school logo in PDF:", error);
        }
    }
    pdf.text(pdfText("GraceLight Learning Centre"), centerX, 33, { align: "center", maxWidth: pageWidth - margin * 2 });
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(10);
    pdf.setTextColor(85, 85, 85);
    pdf.text("Where Wisdom Meets Purpose", centerX, 40, { align: "center" });
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(15);
    pdf.setTextColor(30, 60, 114);
    pdf.text("CBT RESULT SLIP", centerX, 55, { align: "center" });

    let boxY = Math.max(contentTop, Math.min(contentBottom - detailsHeight, (contentTop + contentBottom - detailsHeight) / 2));
    pdf.setDrawColor(148, 163, 184);
    pdf.setLineWidth(0.6);
    pdf.roundedRect(detailX, boxY, detailWidth, detailsHeight, 3, 3);

    let rowY = boxY + innerPadding;
    rowLayouts.forEach(row => {
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(fontSize);
        pdf.setTextColor(55, 65, 81);
        pdf.text(`${row.label}:`, detailX + innerPadding, rowY);

        const isRemark = row.label === "Remark";
        const isPercentage = row.label === "Percentage";
        pdf.setFont("helvetica", isRemark || isPercentage ? "bold" : "normal");
        pdf.setFontSize(isPercentage ? fontSize + 2 : fontSize);
        pdf.setTextColor(isPercentage ? 15 : 31, isPercentage ? 118 : 41, isPercentage ? 110 : 55);
        pdf.text(row.lines, valueX, rowY, { maxWidth: valueWidth });
        rowY += row.rowHeight;
    });

    if (photo) {
        try {
            pdf.addImage(photo, "JPEG", detailX + detailWidth - 29, boxY + 7, 20, 20, undefined, "FAST");
        } catch (error) {
            console.warn("Skipping result photo in PDF:", error);
        }
    }

    const filename = [
        student.candidateName,
        student.subject,
        student.topic
    ].map(safePdfFilenamePart).join("_") + ".pdf";
    pdf.save(filename);
}

function downloadSelectedResultPdf() {
    const status = document.getElementById("downloadStatus");
    const selectedResult = studentHistory.find(result => String(result._id) === String(selectedResultId));
    if (!selectedResult) {
        status.textContent = "Select a result before downloading.";
        return;
    }

    status.textContent = "";
    try {
        createResultPdf(selectedResult);
    } catch (error) {
        console.error("Unable to create result PDF:", error);
        status.textContent = error.message || "The PDF could not be created. Please try again.";
    }
}

</script>

</body>
</html>
