<!DOCTYPE html>
<html>
<head>
<title>CBT Result Slip</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2ff;
    margin: 0;
    padding: 16px;
    color: #1f2937;
}

.container {
    background: #fff;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.08);
}

.school-header {
    text-align: center;
    margin-bottom: 16px;
}

.school-logo {
    width: 90px;
    height: 90px;
    object-fit: contain;
    margin-bottom: 10px;
}

.school-header h1 {
    color: #2563eb;
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
}

.school-header h3 {
    margin: 8px 0 16px;
    color: #555;
    font-style: italic;
    font-weight: 500;
}

.identity-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

#resultPassport {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 2px solid #dbeafe;
}

.school-header h2 {
    margin: 0;
    color: #111827;
    font-size: clamp(1.4rem, 3vw, 2.2rem);
}

.result-layout {
    display: grid;
    grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
    gap: 20px;
    margin-top: 24px;
}

.history-panel,
.detail-panel {
    background: #f8fafc;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 16px;
}

.history-title,
.detail-title {
    margin: 0 0 14px;
    color: #1e3c72;
    font-size: 1.1rem;
    font-weight: 700;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    width: 100%;
    text-align: left;
    border: 1px solid #dbeafe;
    background: white;
    border-radius: 12px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.history-item:hover,
.history-item.active {
    background: #eff6ff;
    border-color: #93c5fd;
    transform: translateY(-1px);
}

.history-item .date {
    display: block;
    font-size: 0.75rem;
    color: #64748b;
    margin-bottom: 6px;
}

.history-item .meta {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.88rem;
    flex-wrap: wrap;
}

.history-item .score-badge {
    font-weight: 700;
    color: #0f766e;
}

.detail-panel {
    min-width: 0;
}

.info {
    display: grid;
    gap: 10px;
    font-size: 1rem;
    line-height: 1.6;
}

.info p {
    margin: 0;
    padding: 10px 12px;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
}

.score {
    color: green;
    font-weight: bold;
}

.print-btn {
    margin-top: 16px;
    padding: 12px 20px;
    border: none;
    background: #1e3c72;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.96rem;
}

.result-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}

.download-btn {
    margin-top: 16px;
    padding: 12px 20px;
    border: none;
    background: #0f766e;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.96rem;
}

.download-status {
    min-height: 1.2em;
    margin-top: 8px;
    color: #b91c1c;
    font-size: 0.9rem;
}

.review-section {
    margin-top: 24px;
}

.review-title {
    font-size: 1.3rem;
    color: #1e3c72;
    margin-bottom: 12px;
    text-align: center;
    font-weight: 700;
}

.review-summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 20px;
}

.review-summary-card {
    background: #eef6ff;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    border: 1px solid #dbeafe;
}

.review-summary-card .label {
    font-size: 0.8rem;
    color: #555;
}

.review-summary-card .value {
    font-size: 1.4rem;
    font-weight: bold;
    color: #1e3c72;
    margin-top: 6px;
}

.review-question {
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 15px;
    background: white;
}

.review-question-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    flex-wrap: wrap;
    gap: 8px;
}

.review-question-header .qnum {
    font-weight: bold;
    font-size: 1rem;
}

.badge {
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: bold;
    color: white;
}

.badge.correct {
    background: #2b8a3e;
}

.badge.wrong {
    background: #c92a2a;
}

.review-question-text {
    margin-bottom: 10px;
    font-size: 1rem;
    text-align: left;
    color: #111827;
}

.review-question img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    margin-bottom: 10px;
}

.review-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    text-align: left;
}

.review-option {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #ddd;
    font-size: 0.95rem;
}

.review-option.selected-wrong {
    background: #ffe3e3;
    border-color: #c92a2a;
    color: #c92a2a;
    font-weight: bold;
}

.review-option.correct-answer {
    background: #ebfbee;
    border-color: #2b8a3e;
    color: #2b8a3e;
    font-weight: bold;
}

.no-review-note {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

@media (max-width: 768px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 16px;
    }

    .result-layout {
        grid-template-columns: 1fr;
    }

    .history-panel,
    .detail-panel {
        padding: 14px;
    }

    .review-summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media print {
    @page {
        size: A4;
        margin: 0;
    }

    html,
    body {
        width: 210mm;
        margin: 0;
        padding: 0;
        background: #fff;
        font-size: 9.5pt;
    }

    .container {
        width: 100%;
        max-width: none;
        margin: 0 auto;
        padding: 15mm;
        border-radius: 0;
        box-shadow: none;
    }

    .school-header {
        margin-bottom: 8mm;
    }

    .school-logo {
        width: 18mm;
        height: 18mm;
        margin-bottom: 1mm;
    }

    .school-header h1 {
        font-size: 16pt;
    }

    .school-header h3 {
        margin: 1mm 0 2mm;
        font-size: 9pt;
    }

    .school-header h2 {
        font-size: 13pt;
    }

    #resultPassport {
        width: 15mm;
        height: 15mm;
    }

    .result-layout {
        display: block;
        margin: 0 auto;
    }

    .print-btn,
    .download-btn,
    .download-status,
    .history-panel,
    .no-print,
    button,
    nav,
    input,
    select {
        display: none !important;
    }

    .detail-panel {
        min-width: 0;
        max-width: 160mm;
        margin: 0 auto;
        border: 1px solid #d1d5db;
        border-radius: 3mm;
        box-shadow: none;
        padding: 8mm;
        background: #fff;
    }

    .detail-title {
        display: none !important;
    }

    .info {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3mm;
        font-size: 10pt;
        line-height: 1.35;
    }

    .info p {
        padding: 3mm;
        border-radius: 2mm;
    }

    .review-section {
        display: none !important;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="result-slip" id="resultSlip">
<div class="school-header">

<img src="logo.png" class="school-logo">

<h1>GraceLight Learning Centre</h1>

<h3>Where Wisdom Meets Purpose</h3>

<div class="identity-row">

<img id="resultPassport" src="images/passport-placeholder.png" />

<h2>CBT RESULT SLIP</h2>

</div>

</div>

<div class="result-layout">

    <aside class="history-panel no-print">
        <h3 class="history-title">Past Attempts</h3>
        <div id="attemptList" class="history-list">
            Loading results...
        </div>
    </aside>

    <main class="detail-panel">
        <h3 class="detail-title">Selected Attempt</h3>
        <div class="info" id="studentInfo">
            Loading result...
        </div>

        <div class="result-actions">
            <button class="print-btn" type="button" onclick="window.print()">Print Result</button>
            <button class="download-btn" id="downloadResultButton" type="button" onclick="downloadSelectedResultPdf()">Download result (PDF)</button>
        </div>
        <p id="downloadStatus" class="download-status" role="status" aria-live="polite"></p>

        <div class="review-section" id="answerReviewSection"></div>
    </main>

</div>
</div>

<script src="vendor/jspdf.umd.min.js"></script>
<script src="result-date.js"></script>
<script>

const studentName = (localStorage.getItem("studentSearch") || "").trim();
let studentHistory = [];
let selectedResultId = null;
let resultPhotoRequest = 0;

function normalizeStudentKey(value) {
    return String(value || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function escapeHtml(value) {
    return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

async function loadStudentResult() {
    try {
        const encodedName = encodeURIComponent(normalizeStudentKey(studentName));
        const response = await fetch(`/results/${encodedName}`);
        const results = await response.json();

        studentHistory = Array.isArray(results) ? results : [];

        if (!studentHistory.length) {
            document.getElementById("studentInfo").innerHTML = `
                <h2 style="color:red;text-align:center; margin:0;">
                    Result Not Found
                </h2>
            `;
            document.getElementById("attemptList").innerHTML = "No past attempts found.";
            return;
        }

        selectedResultId = studentHistory[0]._id;
        renderAttemptList();
        renderSelectedResult(studentHistory[0]);
    } catch (error) {
        console.log(error);
        document.getElementById("studentInfo").innerHTML = `
            <h2 style="color:red;text-align:center; margin:0;">
                Error Loading Result
            </h2>
        `;
    }
}

function renderAttemptList() {
    const list = document.getElementById("attemptList");

    list.innerHTML = studentHistory.map(result => {
        const isActive = result._id === selectedResultId ? "active" : "";
        return `
            <button type="button" class="history-item ${isActive}" data-result-id="${result._id}">
                <span class="date">${escapeHtml(formatResultDate(result))}</span>
                <div class="meta">
                    <span>${result.subject || "N/A"}</span>
                    <span class="score-badge">${result.score || 0}/${result.totalQuestions || 0}</span>
                </div>
            </button>
        `;
    }).join("");

    document.querySelectorAll(".history-item").forEach(button => {
        button.addEventListener("click", () => {
            const clickedId = button.dataset.resultId;
            const chosen = studentHistory.find(item => item._id === clickedId);
            if (chosen) {
                selectedResultId = clickedId;
                renderAttemptList();
                renderSelectedResult(chosen);
            }
        });
    });
}

function renderSelectedResult(student) {
    document.getElementById("studentInfo").innerHTML = `
        <p><strong>Candidate:</strong> ${escapeHtml(student.candidateName || "N/A")}</p>
        <p><strong>Subject:</strong> ${escapeHtml(student.subject || "N/A")}</p>
        <p><strong>Topic:</strong> ${escapeHtml(student.topic || "N/A")}</p>
        <p class="result-date"><strong>Date:</strong> ${escapeHtml(formatResultDate(student))}</p>
        <p><strong>Score:</strong> <span class="score">${escapeHtml(student.score || 0)}/${escapeHtml(student.totalQuestions || 0)}</span></p>
        <p><strong>Percentage:</strong> ${escapeHtml(student.percentage || 0)}%</p>
        <p><strong>Remark:</strong> ${escapeHtml(student.remark || "N/A")}</p>
    `;

    loadResultPhoto(student);
    renderAnswerReview(student);
}

function renderAnswerReview(student) {
    const section = document.getElementById("answerReviewSection");

    const review = student.answersReview;

    if (!Array.isArray(review) || review.length === 0) {
        section.innerHTML = `
            <p class="no-review-note">Answer review not available for this attempt.</p>
        `;
        return;
    }

    const total = review.length;
    const attempted = review.filter(r => r.selected).length;
    const correct = review.filter(r => r.isCorrect).length;
    const wrong = total - correct;
    const percentage = student.percentage != null ? student.percentage : Math.round((correct / total) * 100);

    const summaryHtml = `
        <div class="review-summary">
            <div class="review-summary-card">
                <div class="label">Total Questions</div>
                <div class="value">${total}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Attempted</div>
                <div class="value">${attempted}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Correct</div>
                <div class="value" style="color:#2b8a3e;">${correct}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Wrong</div>
                <div class="value" style="color:#c92a2a;">${wrong}</div>
            </div>
            <div class="review-summary-card">
                <div class="label">Score</div>
                <div class="value">${percentage}%</div>
            </div>
        </div>
    `;

    const optionLabels = ["A", "B", "C", "D"];

    const questionsHtml = review.map(r => {
        const options = r.options || {};

        const optionsHtml = optionLabels
            .filter(letter => options[letter] !== undefined && options[letter] !== null && options[letter] !== "")
            .map(letter => {
                let cls = "review-option";

                if (!r.isCorrect && letter === r.selected) {
                    cls += " selected-wrong";
                }

                if (letter === r.correctAnswer) {
                    cls += " correct-answer";
                }

                return `<div class="${cls}">${letter}. ${escapeHtml(options[letter])}</div>`;
            }).join("");

        return `
            <div class="review-question">
                <div class="review-question-header">
                    <span class="qnum">Question ${r.questionNumber}</span>
                    <span class="badge ${r.isCorrect ? "correct" : "wrong"}">
                        ${r.isCorrect ? "Correct" : "Wrong"}
                    </span>
                </div>

                <div class="review-question-text">${escapeHtml(r.question)}</div>
                ${r.image ? `<img src="${r.image}" alt="Question Image">` : ""}

                <div class="review-options">${optionsHtml}</div>

                <p style="margin-top:8px;font-size:14px;color:#555;">
                    Your answer: <strong>${r.selected || "Not answered"}</strong>
                    &nbsp;|&nbsp;
                    Correct answer: <strong>${r.correctAnswer}</strong>
                </p>
            </div>
        `;
    }).join("");

    section.innerHTML = `
        <div class="review-title">Review of Answers</div>
        ${summaryHtml}
        ${questionsHtml}
    `;
}

loadStudentResult();

const resultPassport = document.getElementById("resultPassport");
const passportPlaceholder = "images/passport-placeholder.png";
let resultPhotoObjectUrl = null;

async function loadResultPhoto(student) {
    const requestId = ++resultPhotoRequest;
    const previousUrl = resultPhotoObjectUrl;
    resultPhotoObjectUrl = null;
    if (previousUrl) URL.revokeObjectURL(previousUrl);
    resultPassport.src = passportPlaceholder;
    if (!student || !student._id) return;

    try {
        const response = await fetch(`/candidate-photo/${encodeURIComponent(student._id)}`, { cache: "no-store" });
        if (response.status === 404) return;
        if (!response.ok) throw new Error(`Photo request failed (HTTP ${response.status})`);
        const objectUrl = URL.createObjectURL(await response.blob());
        if (requestId !== resultPhotoRequest || String(selectedResultId) !== String(student._id)) {
            URL.revokeObjectURL(objectUrl);
            return;
        }
        resultPhotoObjectUrl = objectUrl;
        resultPassport.src = objectUrl;
        await resultPassport.decode();
    } catch (error) {
        if (requestId === resultPhotoRequest) {
            if (resultPhotoObjectUrl) URL.revokeObjectURL(resultPhotoObjectUrl);
            resultPhotoObjectUrl = null;
            resultPassport.src = passportPlaceholder;
            console.error("Unable to load result photo:", error);
        }
    }
}

resultPassport.onerror = () => {
    resultPassport.onerror = null;
    resultPassport.src = passportPlaceholder;
};

function pdfText(value) {
    return String(value == null || value === "" ? "N/A" : value)
        .normalize("NFC")
        .replace(/[\u0000-\u001f\u007f-\u009f]/g, " ")
        .replace(/\s+/g, " ")
        .trim() || "N/A";
}

function safePdfFilenamePart(value) {
    const cleaned = pdfText(value)
        .replace(/\s+/g, "_")
        .replace(/[<>:"/\\|?*\u0000-\u001f]/g, "")
        .replace(/[. ]+$/g, "")
        .replace(/_+/g, "_");
    return cleaned || "Result";
}

async function waitForImage(image) {
    if (image.complete && image.naturalWidth && image.naturalHeight) return;
    await image.decode();
}

async function getImageData(image) {
    await waitForImage(image);
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth;
    canvas.height = image.naturalHeight;
    const context = canvas.getContext("2d");
    if (!context) throw new Error("Image processing is unavailable in this browser.");
    context.drawImage(image, 0, 0);
    return canvas.toDataURL("image/png");
}

async function getCircularPhotoData() {
    const image = resultPassport;
    await waitForImage(image);

    const canvas = document.createElement("canvas");
    canvas.width = 300;
    canvas.height = 300;
    const context = canvas.getContext("2d");
    if (!context) throw new Error("Photo processing is unavailable in this browser.");

    const scale = Math.max(canvas.width / image.naturalWidth, canvas.height / image.naturalHeight);
    const sourceWidth = canvas.width / scale;
    const sourceHeight = canvas.height / scale;
    context.beginPath();
    context.arc(150, 150, 150, 0, Math.PI * 2);
    context.clip();
    context.drawImage(
        image,
        (image.naturalWidth - sourceWidth) / 2,
        (image.naturalHeight - sourceHeight) / 2,
        sourceWidth,
        sourceHeight,
        0,
        0,
        canvas.width,
        canvas.height
    );
    return canvas.toDataURL("image/png");
}

async function createResultPdf(student) {
    const JsPDF = window.jspdf && window.jspdf.jsPDF;
    if (typeof JsPDF !== "function") {
        throw new Error("The PDF library is unavailable. Reload the page and try again.");
    }

    const pdf = new JsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
    const pageWidth = 210;
    const centerX = pageWidth / 2;
    const photo = await getCircularPhotoData();
    const schoolLogo = await getImageData(document.querySelector(".school-logo"));
    const detailWidth = 160;
    const detailX = (pageWidth - detailWidth) / 2;
    const photoSize = 15;
    const photoTitleGap = 4;
    const detailPadding = 8;
    const cellPadding = 3;
    const cellGap = 3;
    const infoWidth = detailWidth - detailPadding * 2;
    const cellWidth = (infoWidth - cellGap) / 2;
    const lineHeight = 10 * 1.35 / 2.83465;
    const cells = [
        { label: "Candidate", value: pdfText(student.candidateName) },
        { label: "Subject", value: pdfText(student.subject) },
        { label: "Topic", value: pdfText(student.topic) },
        { label: "Date", value: formatResultDate(student) },
        { label: "Score", value: `${pdfText(student.score)} / ${pdfText(student.totalQuestions)}` },
        { label: "Percentage", value: `${pdfText(student.percentage)}%` },
        { label: "Remark", value: pdfText(student.remark) }
    ];

    pdf.setTextColor(31, 41, 55);
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(16);
    pdf.addImage(schoolLogo, "PNG", centerX - 9, 15, 18, 18);
    pdf.setTextColor(37, 99, 235);
    pdf.text("GraceLight Learning Centre", centerX, 39, { align: "center" });
    pdf.setFont("helvetica", "normal");
    pdf.setFont("helvetica", "italic");
    pdf.setFontSize(9);
    pdf.setTextColor(85, 85, 85);
    pdf.text("Where Wisdom Meets Purpose", centerX, 45, { align: "center" });
    pdf.setFont("helvetica", "bold");
    pdf.setFontSize(13);
    pdf.setTextColor(30, 60, 114);
    const slipTitle = "CBT RESULT SLIP";
    const titleWidth = pdf.getTextWidth(slipTitle);
    const identityWidth = photoSize + photoTitleGap + titleWidth;
    const photoX = (pageWidth - identityWidth) / 2;
    const photoY = 48.1;
    pdf.addImage(photo, "PNG", photoX, photoY, photoSize, photoSize);
    pdf.setDrawColor(219, 234, 254);
    pdf.setLineWidth(0.5);
    pdf.circle(photoX + photoSize / 2, photoY + photoSize / 2, photoSize / 2);
    pdf.text(slipTitle, photoX + photoSize + photoTitleGap, photoY + photoSize / 2, { baseline: "middle" });

    const rows = [[0, 1], [2, 3], [4, 5], [6, null]].map(pair => pair.map(index => {
        if (index === null) return null;
        const cell = cells[index];
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10);
        const labelWidth = pdf.getTextWidth(`${cell.label}: `);
        pdf.setFont("helvetica", "normal");
        const textWidth = cellWidth - cellPadding * 2;
        const firstLines = pdf.splitTextToSize(cell.value, Math.max(8, textWidth - labelWidth));
        const firstLine = firstLines.shift() || "";
        const remainingText = cell.value.slice(firstLine.length).trimStart();
        const valueLines = [
            firstLine,
            ...(remainingText ? pdf.splitTextToSize(remainingText, textWidth) : [])
        ];
        return {
            ...cell,
            labelWidth,
            valueLines,
            height: Math.max(10, valueLines.length * lineHeight + cellPadding * 2 + 0.52)
        };
    }));
    const rowGap = 3;
    const rowsHeight = rows.reduce((height, row) =>
        height + Math.max(...row.filter(Boolean).map(cell => cell.height)), 0
    ) + rowGap * (rows.length - 1);
    const detailHeight = detailPadding * 2 + rowsHeight + 0.52;
    const boxY = 71.1;
    pdf.setDrawColor(148, 163, 184);
    pdf.setLineWidth(0.6);
    pdf.roundedRect(detailX, boxY, detailWidth, detailHeight, 3, 3);

    let rowY = boxY + detailPadding + 0.3;
    rows.forEach(row => {
        const rowHeight = Math.max(...row.filter(Boolean).map(cell => cell.height));
        row.forEach((cell, column) => {
            if (!cell) return;
            const cellX = detailX + detailPadding + column * (cellWidth + cellGap);
            pdf.setDrawColor(229, 231, 235);
            pdf.setLineWidth(0.25);
            pdf.roundedRect(cellX, rowY, cellWidth, rowHeight, 2, 2);
            pdf.setFontSize(10);
            pdf.setTextColor(31, 41, 55);
            pdf.setFont("helvetica", "bold");
            const baseline = rowY + cellPadding + 3.6;
            pdf.text(`${cell.label}:`, cellX + cellPadding, baseline);
            pdf.setFont("helvetica", "normal");
            pdf.text(
                cell.valueLines[0] || "",
                cellX + cellPadding + cell.labelWidth,
                baseline
            );
            if (cell.valueLines.length > 1) {
                pdf.text(
                    cell.valueLines.slice(1),
                    cellX + cellPadding,
                    baseline + lineHeight
                );
            }
        });
        rowY += rowHeight + rowGap;
    });

    const filename = [
        student.candidateName,
        student.subject,
        student.topic
    ].map(safePdfFilenamePart).join("_") + ".pdf";
    pdf.save(filename);
    return pdf;
}

async function downloadSelectedResultPdf() {
    const status = document.getElementById("downloadStatus");
    const selectedResult = studentHistory.find(result => String(result._id) === String(selectedResultId));
    if (!selectedResult) {
        status.textContent = "Select a result before downloading.";
        return;
    }

    status.textContent = "";
    try {
        await createResultPdf(selectedResult);
    } catch (error) {
        console.error("Unable to create result PDF:", error);
        status.textContent = error.message || "The PDF could not be created. Please try again.";
    }
}
