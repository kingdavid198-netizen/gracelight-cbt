<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraceLight CBT Admin Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7ff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1e3cff;
}

input, select, textarea, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    background:#1e3cff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1028aa;
}

.question-box{
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:6px;
    background:#fafafa;
}

.delete-btn{
    background:red;
    margin-top:10px;
}

.stats{
    margin-top:20px;
    padding:15px;
    background:#eef2ff;
    border-radius:6px;
}

</style>

</head>

<body>

<div class="container">

<h1>GraceLight CBT Admin Dashboard</h1>

<h2>Generate Exam PIN</h2>

<button onclick="generatePin()">
Generate PIN
</button>

<div id="pinBox"
style="
margin-top:15px;
padding:15px;
background:#eef2ff;
font-size:22px;
font-weight:bold;
text-align:center;
border-radius:8px;
color:#1e3cff;
">
No PIN Generated
</div>
<button onclick="window.location.href='pin-management.html'">
    PIN Management
</button>
<select id="subject">
<option value="">Select Subject</option>
<option>Account</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Commerce</option>
<option>CRS</option>
<option>Economics</option>
<option>English</option>
<option>Government</option>
<option>Literature</option>
<option>Mathematics</option>
<option>Physics</option>
</select>

<input type="text" id="topic" placeholder="Enter Topic">

<textarea id="question" placeholder="Enter Question"></textarea>

<input type="text" id="optionA" placeholder="Option A">
<input type="text" id="optionB" placeholder="Option B">
<input type="text" id="optionC" placeholder="Option C">
<input type="text" id="optionD" placeholder="Option D">

<select id="answer">
<option value="">Select Correct Answer</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>

<button onclick="saveQuestion()">Save Question</button>

<div class="stats" id="statsBox">
Total Questions: 0
</div>

<div id="questionsContainer"></div>

</div>

<script>

let editIndex = -1;
let currentPin = "";
    
async function saveQuestion(){

    const subject = document.getElementById("subject").value;
    const topic = document.getElementById("topic").value;
    const question = document.getElementById("question").value;
    const optionA = document.getElementById("optionA").value;
    const optionB = document.getElementById("optionB").value;
    const optionC = document.getElementById("optionC").value;
    const optionD = document.getElementById("optionD").value;
    const answer = document.getElementById("answer").value;

    if(
        subject === "" ||
        topic === "" ||
        question === "" ||
        optionA === "" ||
        optionB === "" ||
        optionC === "" ||
        optionD === "" ||
        answer === ""
    ){
        alert("Please fill all fields");
        return;
    }

    let url = "/add-question";
let method = "POST";

if(editIndex !== -1){
    url = "/update-question/" + editIndex;
    method = "POST";
}

const response = await fetch(url, {

    method: method,

    headers:{
        "Content-Type":"application/json"
    },

    body:JSON.stringify({
        subject,
        topic,
        question,
        optionA,
        optionB,
        optionC,
        optionD,
        answer
    })

});

    const data = await response.json();

    editIndex = -1;

    if(data.success){

        alert("Question Saved Successfully");

        document.getElementById("topic").value = "";
        document.getElementById("question").value = "";
        document.getElementById("optionA").value = "";
        document.getElementById("optionB").value = "";
        document.getElementById("optionC").value = "";
        document.getElementById("optionD").value = "";
        document.getElementById("answer").value = "";

        loadQuestions();

    }else{

        alert("Error Saving Question");

    }

}

async function loadQuestions(){

    const container = document.getElementById("questionsContainer");

    container.innerHTML = "";

    const response = await fetch("/questions");

    const questions = await response.json();

    document.getElementById("statsBox").innerHTML =
    "Total Questions: " + questions.length;

    questions.forEach((q,index)=>{

        let div = document.createElement("div");

        div.className = "question-box";

        div.innerHTML = `

        <b>Subject:</b> ${q.subject}<br><br>

        <b>Topic:</b> ${q.topic}<br><br>

        <b>Question:</b> ${q.question}<br><br>

        A. ${q.optionA}<br>
        B. ${q.optionB}<br>
        C. ${q.optionC}<br>
        D. ${q.optionD}<br><br>

        <b>Correct Answer:</b> ${q.answer}<br><br>

        <button class="edit-btn"
        onclick="editQuestion('${q._id}')">
        Edit
        </button>

        <button class="delete-btn"
       onclick="deleteQuestion('${q._id}')">
        Delete
        </button>

        `;

        container.appendChild(div);

    });

}

async function editQuestion(id){

    const response = await fetch("/questions");

    const questions = await response.json();

    const q = questions.find(item => item._id == id);

    if(!q){
        alert("Question not found");
        return;
    }

    document.getElementById("subject").value = q.subject;
    document.getElementById("topic").value = q.topic;
    document.getElementById("question").value = q.question;
    document.getElementById("optionA").value = q.optionA;
    document.getElementById("optionB").value = q.optionB;
    document.getElementById("optionC").value = q.optionC;
    document.getElementById("optionD").value = q.optionD;
    document.getElementById("answer").value = q.answer;

    editIndex = id;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

async function deleteQuestion(id){

    if(confirm("Delete this question?")){

        const response = await fetch("/delete-question/" + id, {

            method:"DELETE"

        });

        const data = await response.json();

        if(data.success){

            alert("Question Deleted");

            loadQuestions();

        }else{

            alert("Error deleting question");

        }

    }

}

function generatePin(){

const pin =
Math.floor(100000 + Math.random() * 900000);

fetch("/save-pin",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
pin:pin
})

})

.then(response => response.json())

.then(data => {

if(data.success){

document.getElementById("pinBox").innerHTML =
"PIN: " + pin;
currentPin = pin;
    
alert("PIN Generated Successfully");

}else{

alert("Error Saving PIN");

}

});

}
function loadLatestPin(){

    fetch("/get-pin")

    .then(response => response.json())

    .then(data => {

        if(data.pins && data.pins.length > 0){

            const latestPin =
            data.pins[data.pins.length - 1].pin;

            document.getElementById("pinBox").innerHTML =
            "PIN: " + latestPin;
currentPin = latestPin;
        }

    });

}

loadQuestions();
loadLatestPin();

</script>

</body>
</html>
