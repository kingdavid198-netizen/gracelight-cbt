<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GraceLight CBT Admin Dashboard</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7ff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1e3cff;
}

input, select, textarea, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    background:#1e3cff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1028aa;
}

.question-box{
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:6px;
    background:#fafafa;
}

.delete-btn{
    background:red;
    margin-top:10px;
}

.stats{
    margin-top:20px;
    padding:15px;
    background:#eef2ff;
    border-radius:6px;
}
 .question-card p {
    margin: 0;
    padding: 0;
}

.question-card br {
    line-height: 1.2;
}   
.question-box p{
    margin:0;
    padding:0;
}

.question-box div{
    margin:2px 0;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>
</head>

<body>

<script>
if(localStorage.getItem("adminAuthorized") !== "true"){
    alert("Access Denied! Please login as Admin.");
    window.location.href = "login.html";
}
</script>
    
<div class="container">

<h1>GraceLight CBT Admin Dashboard</h1>

<button onclick="logoutAdmin()" style="background:red; margin-bottom:15px;">
    Logout
</button>    

<h2>Generate Exam PIN</h2>

<button onclick="generatePin()">
Generate PIN
</button>

<div id="pinBox"
style="
margin-top:15px;
padding:15px;
background:#eef2ff;
font-size:22px;
font-weight:bold;
text-align:center;
border-radius:8px;
color:#1e3cff;
">
No PIN Generated
</div>
<button onclick="window.location.href='pin-management.html'">
    PIN Management
</button>
<select id="subject">
<option value="">Select Subject</option>
<option>Account</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Commerce</option>
<option>CRS</option>
<option>Economics</option>
<option>English</option>
<option>Government</option>
<option>Literature</option>
<option>Mathematics</option>
<option>Physics</option>
</select>

<input type="text" id="topic" placeholder="Enter Topic">

<textarea id="question" placeholder="Enter Question"></textarea>

    <label><strong>Question Image (Optional)</strong></label>

<input type="file" id="questionImage" accept="image/*">

<input type="hidden" id="imageUrl">
<textarea id="optionA"></textarea>

<textarea id="optionB"></textarea>

<textarea id="optionC"></textarea>

<textarea id="optionD"></textarea>

<select id="answer">
<option value="">Select Correct Answer</option>
<option value="A">A</option>
<option value="B">B</option>
<option value="C">C</option>
<option value="D">D</option>
</select>

<button onclick="saveQuestion()">Save Question</button>

<div class="stats" id="statsBox">
Total Questions: 0
</div>

  <hr>

<h2>Bulk Upload Questions</h2>

<input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls,.csv">

<button onclick="bulkUpload()">
    Upload Excel File
</button>

<br><br>  
    
<div id="questionsContainer"></div>

</div>

<script>

    document.addEventListener("DOMContentLoaded", () => {

    const imageInput = document.getElementById("questionImage");

    imageInput.addEventListener("change", async () => {

        const file = imageInput.files[0];

        if (!file) return;

        const formData = new FormData();

        formData.append("image", file);

        try {

            const response = await fetch("/upload-image", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.success) {

                document.getElementById("imageUrl").value = data.url;

                alert("Image uploaded successfully");

            } else {

                alert("Image upload failed");

            }

        } catch (err) {

            console.error(err);

            alert("Upload error");

        }

    });

});

let editIndex = -1;
let currentPin = "";
    
let questionEditor;
let optionAEditor;
let optionBEditor;
let optionCEditor;
let optionDEditor;

tinymce.init({
    selector: '#question',

    plugins: [
        'lists',
        'link',
        'table',
        'charmap',
        'code'
    ],

    toolbar:
        'undo redo | ' +
        'bold italic underline | ' +
        'superscript subscript | ' +
        'charmap | ' +
        'bullist numlist | ' +
        'table | ' +
        'code',

    height: 300,

    setup: function(editor) {
        questionEditor = editor;
    }
});   

tinymce.init({
    selector: '#optionA',
    height: 150,
    toolbar: 'bold italic underline superscript subscript charmap',
    setup: function(editor){
        optionAEditor = editor;
    }
});

tinymce.init({
    selector: '#optionB',
    height: 150,
    toolbar: 'bold italic underline superscript subscript charmap',
    setup: function(editor){
        optionBEditor = editor;
    }
});

tinymce.init({
    selector: '#optionC',
    height: 150,
    toolbar: 'bold italic underline superscript subscript charmap',
    setup: function(editor){
        optionCEditor = editor;
    }
});

tinymce.init({
    selector: '#optionD',
    height: 150,
    toolbar: 'bold italic underline superscript subscript charmap',
    setup: function(editor){
        optionDEditor = editor;
    }
});    
async function saveQuestion(){

    const subject = document.getElementById("subject").value;
    const topic = document.getElementById("topic").value;
    const question = questionEditor.getContent();
    const optionA = optionAEditor.getContent();
    const optionB = optionBEditor.getContent();
    const optionC = optionCEditor.getContent();
    const optionD = optionDEditor.getContent();
    const answer = document.getElementById("answer").value;
    const imageUrl = document.getElementById("imageUrl").value;
    if(
        subject === "" ||
        topic === "" ||
        question === "" ||
        optionA === "" ||
        optionB === "" ||
        optionC === "" ||
        optionD === "" ||
        answer === ""
    ){
        alert("Please fill all fields");
        return;
    }

    let url = "/add-question";
let method = "POST";

if(editIndex !== -1){
    url = "/update-question/" + editIndex;
    method = "POST";
}

const response = await fetch(url, {

    method: method,

    headers:{
        "Content-Type":"application/json"
    },

    body: JSON.stringify({
    subject,
    topic,
    question,
    image: imageUrl,
    optionA,
    optionB,
    optionC,
    optionD,
    answer
})

});

    const data = await response.json();

    editIndex = -1;

    if(data.success){

        alert("Question Saved Successfully");

        document.getElementById("topic").value = "";
        questionEditor.setContent('');
        optionAEditor.setContent('');
        optionBEditor.setContent('');
        optionCEditor.setContent('');
        optionDEditor.setContent('');
        document.getElementById("answer").value = "";

        loadQuestions();

    }else{

        alert("Error Saving Question");

    }

}

async function loadQuestions(){

    const container = document.getElementById("questionsContainer");

    container.innerHTML = "";

    const response = await fetch("/questions");

    const questions = await response.json();

    document.getElementById("statsBox").innerHTML =
    "Total Questions: " + questions.length;

    questions.forEach((q,index)=>{

        let div = document.createElement("div");

        div.className = "question-box";

        div.innerHTML = `

        <b>Subject:</b> ${q.subject}<br><br>

        <b>Topic:</b> ${q.topic}<br><br>

        <b>Question:</b>
        <div>${q.question}</div>
        <br>

        ${q.image ? `<img src="${q.image}" style="max-width:300px;display:block;margin-bottom:15px;">` : ""}

        <div>A. ${q.optionA}</div>
        <div>B. ${q.optionB}</div>
        <div>C. ${q.optionC}</div>
        <div>D. ${q.optionD}</div>
        <br>

        <b>Correct Answer:</b> ${q.answer}<br><br>

        <button class="edit-btn"
        onclick="editQuestion('${q._id}')">
        Edit
        </button>

        <button class="delete-btn"
       onclick="deleteQuestion('${q._id}')">
        Delete
        </button>

        `;

        container.appendChild(div);

    });

}

async function editQuestion(id){

    const response = await fetch("/questions");

    const questions = await response.json();

    const q = questions.find(item => item._id == id);

    if(!q){
        alert("Question not found");
        return;
    }

    document.getElementById("subject").value = q.subject;
    document.getElementById("topic").value = q.topic;
    questionEditor.setContent(q.question);
    optionAEditor.setContent(q.optionA);
    optionBEditor.setContent(q.optionB);
    optionCEditor.setContent(q.optionC);
    optionDEditor.setContent(q.optionD);
    document.getElementById("answer").value = q.answer;

    editIndex = id;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

async function deleteQuestion(id){

    if(confirm("Delete this question?")){

        const response = await fetch("/delete-question/" + id, {

            method:"DELETE"

        });

        const data = await response.json();

        if(data.success){

            alert("Question Deleted");

            loadQuestions();

        }else{

            alert("Error deleting question");

        }

    }

}

function generatePin(){

const pin =
Math.floor(100000 + Math.random() * 900000);

fetch("/save-pin",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
pin:pin
})

})

.then(response => response.json())

.then(data => {

if(data.success){

document.getElementById("pinBox").innerHTML =
"PIN: " + pin;
currentPin = pin;
    
alert("PIN Generated Successfully");

}else{

alert("Error Saving PIN");

}

});

}
function loadLatestPin(){

    fetch("/get-pin")

    .then(response => response.json())

    .then(data => {

        if(data.pins && data.pins.length > 0){

            const latestPin =
            data.pins[data.pins.length - 1].pin;

            document.getElementById("pinBox").innerHTML =
            "PIN: " + latestPin;
currentPin = latestPin;
        }

    });

}

async function bulkUpload() {

    const file =
        document.getElementById("excelFile").files[0];

    if (!file) {
        alert("Please select a file");
        return;
    }

    const formData = new FormData();

    formData.append("file", file);

    try {

        const response = await fetch(
            "/bulk-upload",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                data.count +
                " questions uploaded successfully"
            );

            loadQuestions();

        } else {

            alert(
                data.message ||
                "Upload failed"
            );
        }

    } catch (error) {

        console.log(error);

        alert("Upload failed");
    }
}
    
loadQuestions();
loadLatestPin();

function logoutAdmin(){
    localStorage.removeItem("adminAuthorized");
    window.location.href = "login.html";
}    

</script>

</body>
</html>
