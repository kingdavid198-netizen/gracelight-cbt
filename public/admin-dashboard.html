<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7ff;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#1e3cff;
}

input, select, textarea, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:15px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

button{
    background:#1e3cff;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#1028aa;
}

.question-box{
    border:1px solid #ddd;
    padding:15px;
    margin-top:15px;
    border-radius:6px;
    background:#fafafa;
}

.delete-btn{
    background:red;
    margin-top:10px;
}

.stats{
    margin-top:20px;
    padding:15px;
    background:#eef2ff;
    border-radius:6px;
}

.admin-nav{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin:20px 0;
}

.admin-nav button{
    margin:0;
}

.admin-nav button.active-tab{
    background:#1028aa;
}

.admin-section{
    display:none;
}

.admin-section.active-section{
    display:block;
}

.results-table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

.results-table th,
.results-table td{
    border:1px solid #ccc;
    padding:12px;
    text-align:center;
}

.results-table th{
    background:#2563eb;
    color:white;
}

.results-table tr:nth-child(even){
    background:#f9f9f9;
}

.results-table button,
.formula-card button{
    width:auto;
    padding:6px 10px;
    margin:0;
}

.danger-button{
    background:#dc2626;
}

.formula-card{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:10px;
    border-radius:8px;
}

@media (max-width:700px){
    .admin-nav{
        grid-template-columns:repeat(2, 1fr);
    }

    .results-table{
        display:block;
        overflow-x:auto;
    }
}
 .question-card p {
    margin: 0;
    padding: 0;
}

.question-card br {
    line-height: 1.2;
}   
.question-box p{
    margin:0;
    padding:0;
}

.question-box div{
    margin:2px 0;
}

.option-row,
.answer-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:15px;
}

.option-label{
    width:70px;
    flex-shrink:0;
    font-weight:bold;
    padding-top:8px;
}

.option-field{
    flex:1;
    min-width:0;
}

.option-row .option-field textarea,
.option-row .option-field .tox-tinymce,
.answer-row .option-field select{
    width:100%;
    margin:0;
}

.option-row .option-field textarea,
.option-row .option-field .tox-tinymce{
    min-height:120px;
}

.answer-row .option-field select{
    min-height:46px;
}
</style>

<script>

    document.addEventListener("DOMContentLoaded", () => {

    const imageInput = document.getElementById("questionImage");

    imageInput.addEventListener("change", async () => {

        const file = imageInput.files[0];

        if (!file) return;

        const formData = new FormData();

        formData.append("image", file);

        try {

            const response = await fetch("/upload-image", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            if (data.success) {

                document.getElementById("imageUrl").value = data.url;

                alert("Image uploaded successfully");

            } else {

                alert("Image upload failed");

            }

        } catch (err) {

            console.error(err);

            alert("Upload error");

        }

    });

});

let editIndex = -1;
let currentPin = "";
let editingExamConfigId = null;

async function saveQuestion(){

    const subject = document.getElementById("subject").value;
    const topic = document.getElementById("topic").value;
    const question = questionEditor.getContent();
    const optionA = optionAEditor.getContent();
    const optionB = optionBEditor.getContent();
    const optionC = optionCEditor.getContent();
    const optionD = optionDEditor.getContent();
    const answer = document.getElementById("answer").value;
    const imageUrl = document.getElementById("imageUrl").value;
    if(
        subject === "" ||
        topic === "" ||
        question === "" ||
        optionA === "" ||
        optionB === "" ||
        optionC === "" ||
        optionD === "" ||
        answer === ""
    ){
        alert("Please fill all fields");
        return;
    }

    let url = "/add-question";
let method = "POST";

if(editIndex !== -1){
    url = "/update-question/" + editIndex;
    method = "POST";
}

const response = await fetch(url, {

    method: method,

    headers:{
        "Content-Type":"application/json"
    },

    body: JSON.stringify({
    subject,
    topic,
    question,
    image: imageUrl,
    optionA,
    optionB,
    optionC,
    optionD,
    answer
})

});

    const data = await response.json();

    editIndex = -1;

    if(data.success){

        alert("Question Saved Successfully");

        document.getElementById("topic").value = "";
        questionEditor.setContent('');
        optionAEditor.setContent('');
        optionBEditor.setContent('');
        optionCEditor.setContent('');
        optionDEditor.setContent('');
        document.getElementById("answer").value = "";

        loadQuestions();

    }else{

        alert("Error Saving Question");

    }

}

async function loadQuestions(){

    const container = document.getElementById("questionsContainer");

    container.innerHTML = "";

    const response = await fetch("/questions");

    const questions = await response.json();

    document.getElementById("statsBox").innerHTML =
    "Total Questions: " + questions.length;

    questions.forEach((q,index)=>{

        let div = document.createElement("div");

        div.className = "question-box";

        div.innerHTML = `

        <label><input type="checkbox" class="question-checkbox" value="${q._id}"> Select</label><br><br>

        <b>Subject:</b> ${q.subject}<br><br>

        <b>Topic:</b> ${q.topic}<br><br>

        <b>Question:</b>
        <div>${q.question}</div>
        <br>

        ${q.image ? `<img src="${q.image}" style="max-width:300px;display:block;margin-bottom:15px;">` : ""}

        <div>A. ${q.optionA}</div>
        <div>B. ${q.optionB}</div>
        <div>C. ${q.optionC}</div>
        <div>D. ${q.optionD}</div>
        <br>

        <b>Correct Answer:</b> ${q.answer}<br><br>

        <button class="edit-btn"
        onclick="editQuestion('${q._id}')">
        Edit
        </button>

        <button class="delete-btn"
       onclick="deleteQuestion('${q._id}')">
        Delete
        </button>

        `;

        container.appendChild(div);

    });

}

async function editQuestion(id){

    const response = await fetch("/questions");

    const questions = await response.json();

    const q = questions.find(item => item._id == id);

    if(!q){
        alert("Question not found");
        return;
    }

    document.getElementById("subject").value = q.subject;
    document.getElementById("topic").value = q.topic;
    questionEditor.setContent(q.question);
    optionAEditor.setContent(q.optionA);
    optionBEditor.setContent(q.optionB);
    optionCEditor.setContent(q.optionC);
    optionDEditor.setContent(q.optionD);
    document.getElementById("answer").value = q.answer;

    editIndex = id;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}

async function deleteQuestion(id){

    if(confirm("Delete this question?")){

        const response = await fetch("/delete-question/" + id, {

            method:"DELETE"

        });

        const data = await response.json();

        if(data.success){

            alert("Question Deleted");

            loadQuestions();

        }else{

            alert("Error deleting question");

        }

    }

}

function toggleAllQuestions(checked){
    document.querySelectorAll(".question-checkbox").forEach(checkbox => {
        checkbox.checked = checked;
    });
}

async function deleteSelectedQuestions(){
    const ids = Array.from(document.querySelectorAll(".question-checkbox:checked"))
        .map(checkbox => checkbox.value);

    if(ids.length === 0){
        alert("Select at least one question to delete.");
        return;
    }

    if(!confirm(`Delete ${ids.length} selected questions? This cannot be undone.`)){
        return;
    }

    try{
        const response = await fetch("/delete-questions", {
            method: "DELETE",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ids })
        });
        const data = await response.json();

        if(!data.success){
            throw new Error(data.message || "Bulk delete failed");
        }

        loadQuestions();
    }catch(error){
        console.log(error);
        alert("Error deleting selected questions");
    }
}

function showAdminSection(sectionId, button){
    document.querySelectorAll(".admin-section").forEach(section => {
        section.classList.toggle("active-section", section.id === sectionId);
    });

    document.querySelectorAll(".admin-nav button").forEach(navButton => {
        navButton.classList.toggle("active-tab", navButton === button);
    });

    if(sectionId === "resultsSection"){
        loadResults();
    }

    if(sectionId === "formulaSection"){
        loadFormulas();
    }
}

async function loadResults(){
    const resultsBody = document.getElementById("resultsBody");
    resultsBody.innerHTML = "";

    try{
        const response = await fetch("/results");
        const allResults = await response.json();

        if(!allResults.length){
            resultsBody.innerHTML = '<tr><td colspan="9">No Results Found</td></tr>';
            return;
        }

        allResults.forEach(result => {
            resultsBody.innerHTML += `
                <tr>
                    <td><input type="checkbox" class="result-checkbox" value="${result._id}"></td>
                    <td>${result.candidateName || result.candidate || "N/A"}</td>
                    <td>${result.subject || "N/A"}</td>
                    <td>${result.topic || "N/A"}</td>
                    <td>${result.score || 0}/${result.totalQuestions || 0}</td>
                    <td>${result.percentage || 0}%</td>
                    <td>${result.remark || "N/A"}</td>
                    <td>${result.date || "N/A"}</td>
                    <td><button type="button" class="danger-button" onclick="deleteResult('${result._id}')">Delete</button></td>
                </tr>
            `;
        });
    }catch(error){
        console.log(error);
        resultsBody.innerHTML = '<tr><td colspan="9">Error Loading Results</td></tr>';
    }
}

async function deleteResult(id){
    if(!confirm("Are you sure you want to delete this result?")){
        return;
    }

    try{
        const response = await fetch(`/delete-result/${id}`, { method:"DELETE" });
        const data = await response.json();

        if(data.success){
            alert("Result deleted successfully");
            loadResults();
        }else{
            alert("Failed to delete result");
        }
    }catch(error){
        console.log(error);
        alert("Error deleting result");
    }
}

function toggleAllResults(checked){
    document.querySelectorAll(".result-checkbox").forEach(checkbox => {
        checkbox.checked = checked;
    });
}

async function deleteSelectedResults(){
    const ids = Array.from(document.querySelectorAll(".result-checkbox:checked"))
        .map(checkbox => checkbox.value);

    if(!ids.length){
        alert("Select at least one result to delete.");
        return;
    }

    if(!confirm(`Delete ${ids.length} selected results? This cannot be undone.`)){
        return;
    }

    try{
        const response = await fetch("/delete-results", {
            method:"DELETE",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({ids})
        });
        const data = await response.json();

        if(!data.success){
            throw new Error(data.message || "Bulk delete failed");
        }

        document.getElementById("selectAllResults").checked = false;
        loadResults();
    }catch(error){
        console.log(error);
        alert("Error deleting selected results");
    }
}

CKEDITOR.replace("formulaContent");

document.getElementById("saveFormulaBtn").onclick = async function(){
    const subject = document.getElementById("formulaSubject").value;
    const title = document.getElementById("formulaTitle").value.trim();
    const content = CKEDITOR.instances.formulaContent.getData();
    const imageFile = document.getElementById("formulaImage").files[0];

    if(!title || content.trim() === ""){
        alert("Please enter formula title and content");
        return;
    }

    const formData = new FormData();
    formData.append("subject", subject);
    formData.append("title", title);
    formData.append("content", content);
    if(imageFile){
        formData.append("image", imageFile);
    }

    try{
        const response = await fetch("/formulas", { method:"POST", body:formData });
        const result = await response.json();

        if(result.success){
            alert("Formula Saved Successfully");
            document.getElementById("formulaTitle").value = "";
            document.getElementById("formulaImage").value = "";
            CKEDITOR.instances.formulaContent.setData("");
            loadFormulas();
        }else{
            alert(result.message || "Error Saving Formula");
        }
    }catch(error){
        console.log(error);
        alert("Error Saving Formula");
    }
};

async function loadFormulas(){
    const formulaList = document.getElementById("formulaList");
    formulaList.innerHTML = "";

    try{
        const response = await fetch("/formulas");
        const formulas = await response.json();

        formulas.forEach(formula => {
            formulaList.innerHTML += `
                <div class="formula-card">
                    <b>${formula.subject}</b>
                    <h3>${formula.title}</h3>
                    <p>${formula.content}</p>
                    ${formula.image ? `<img src="${formula.image}" style="max-width:300px;display:block;margin-top:10px;margin-bottom:10px;">` : ""}
                    <button type="button" class="danger-button" onclick="deleteFormula('${formula._id}')">Delete</button>
                </div>
            `;
        });
    }catch(error){
        console.log(error);
        formulaList.innerHTML = "Unable to load formulas.";
    }
}

async function bulkFormulaUpload(){
    const file = document.getElementById("formulaExcelFile").files[0];

    if(!file){
        alert("Please choose an Excel file");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);

    try{
        const response = await fetch("/bulk-formulas", { method:"POST", body:formData });
        const result = await response.json();

        if(result.success){
            alert(`${result.count} formulas uploaded successfully`);
            loadFormulas();
        }else{
            alert(result.message || "Upload failed");
        }
    }catch(error){
        console.log(error);
        alert("Error uploading formulas");
    }
}

async function deleteFormula(id){
    if(!confirm("Delete this formula?")){
        return;
    }

    try{
        await fetch(`/formulas/${id}`, { method:"DELETE" });
        loadFormulas();
    }catch(error){
        console.log(error);
        alert("Error deleting formula");
    }
}

async function saveExamConfig(){
    const subject = document.getElementById("configSubject").value;
    const topic = document.getElementById("configTopic").value.trim();
    const durationMinutes = Number(document.getElementById("durationMinutes").value);

    if (!subject) {
        alert("Please select a subject for the exam duration.");
        return;
    }

    if (!Number.isFinite(durationMinutes) || durationMinutes < 1) {
        alert("Please enter a valid exam duration in minutes.");
        return;
    }

    try {
        const method = editingExamConfigId ? "PUT" : "POST";
        const url = editingExamConfigId ? `/exam-config/${editingExamConfigId}` : "/exam-config";

        const response = await fetch(url, {
            method,
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                subject,
                topic,
                durationMinutes
            })
        });

        const data = await response.json();

        if (data.success) {
            const successMessage = editingExamConfigId
                ? "Exam duration updated successfully."
                : "Exam duration saved successfully.";

            document.getElementById("examConfigStatus").innerText = successMessage;
            document.getElementById("configSubject").value = "";
            document.getElementById("configTopic").value = "";
            document.getElementById("durationMinutes").value = "";
            editingExamConfigId = null;
            document.getElementById("saveExamConfigBtn").innerText = "Save Exam Duration";
            loadExamConfig();
        } else {
            document.getElementById("examConfigStatus").innerText = data.message || "Unable to save exam duration.";
            alert(data.message || "Unable to save exam duration.");
        }
    } catch (error) {
        console.log(error);
        document.getElementById("examConfigStatus").innerText = "Unable to save exam duration.";
        alert("Unable to save exam duration.");
    }
}

async function deleteExamConfig(id){
    const config = examConfigs.find(item => item._id === id);
    const name = config ? `${config.subject}${config.topic ? ` / ${config.topic}` : " (default)"}` : "this exam config";

    if (!confirm(`Delete saved duration for ${name}?`)) {
        return;
    }

    try {
        const response = await fetch(`/exam-config/${id}`, {
            method: "DELETE"
        });

        const data = await response.json();

        if (data.success) {
            if (editingExamConfigId === id) {
                editingExamConfigId = null;
                document.getElementById("saveExamConfigBtn").innerText = "Save Exam Duration";
                document.getElementById("configSubject").value = "";
                document.getElementById("configTopic").value = "";
                document.getElementById("durationMinutes").value = "";
            }
            document.getElementById("examConfigStatus").innerText = "Exam duration deleted successfully.";
            loadExamConfig();
        } else {
            alert(data.message || "Unable to delete exam duration.");
        }
    } catch (error) {
        console.log(error);
        alert("Unable to delete exam duration.");
    }
}

function editExamConfig(id){
    const config = examConfigs.find(item => item._id === id);

    if (!config) {
        alert("Exam duration not found.");
        return;
    }

    editingExamConfigId = id;
    document.getElementById("configSubject").value = config.subject || "";
    document.getElementById("configTopic").value = config.topic || "";
    document.getElementById("durationMinutes").value = config.durationMinutes || "";
    document.getElementById("saveExamConfigBtn").innerText = "Update Exam Duration";
    document.getElementById("examConfigStatus").innerText = "Editing saved exam duration.";
    window.scrollTo({ top: 0, behavior: "smooth" });
}

async function loadExamConfig(){
    try {
        const response = await fetch("/exam-config");
        const configs = await response.json();
        examConfigs = Array.isArray(configs) ? configs : [];

        const list = document.getElementById("examConfigList");

        if (!examConfigs.length) {
            list.innerHTML = "<p>No exam durations saved yet.</p>";
            return;
        }

        list.innerHTML = `
            <table style="width:100%; border-collapse:collapse; margin-top:10px;">
                <thead>
                    <tr>
                        <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Subject</th>
                        <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Topic</th>
                        <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Duration</th>
                        <th style="text-align:left; padding:8px; border-bottom:1px solid #ddd;">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${examConfigs.map(config => `
                        <tr>
                            <td style="padding:8px; border-bottom:1px solid #eee;">${config.subject || "N/A"}</td>
                            <td style="padding:8px; border-bottom:1px solid #eee;">${config.topic || "default"}</td>
                            <td style="padding:8px; border-bottom:1px solid #eee;">${config.durationMinutes || 0} min</td>
                            <td style="padding:8px; border-bottom:1px solid #eee;">
                                <button type="button" onclick="editExamConfig('${config._id}')" style="width:auto; margin-right:8px; padding:8px 10px;">Edit</button>
                                <button type="button" onclick="deleteExamConfig('${config._id}')" style="width:auto; padding:8px 10px; background:#dc2626;">Delete</button>
                            </td>
                        </tr>
                    `).join("")}
                </tbody>
            </table>
        `;
    } catch (error) {
        console.log(error);
        document.getElementById("examConfigList").innerHTML = "Unable to load saved exam durations.";
    }
}

async function bulkUpload() {

    const file =
        document.getElementById("excelFile").files[0];

    if (!file) {
        alert("Please select a file");
        return;
    }

    const formData = new FormData();

    formData.append("file", file);

    try {

        const response = await fetch(
            "/bulk-upload",
            {
                method: "POST",
                body: formData
            }
        );

        const data = await response.json();

        if (data.success) {

            alert(
                data.count +
                " questions uploaded successfully"
            );

            loadQuestions();

        } else {

            alert(
                data.message ||
                "Upload failed"
            );
        }

    } catch (error) {

        console.log(error);

        alert("Upload failed");
    }
}
