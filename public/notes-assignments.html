<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes &amp; Assignments - GraceLight CBT</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/contrib/auto-render.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.1/contrib/mhchem.min.js"></script>
<script defer src="/render.js"></script>
<style>
:root{
    color-scheme:light;
    --ink:#1c2730;
    --muted:#5e6b73;
    --line:#d7dfe2;
    --paper:#fff;
    --canvas:#edf2ef;
    --green:#176b48;
    --green-dark:#104d35;
}
*{box-sizing:border-box}
body{
    margin:0;
    padding:24px;
    background:var(--canvas);
    color:var(--ink);
    font-family:Arial,sans-serif;
}
main{max-width:1000px;margin:0 auto}
header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    margin-bottom:24px;
}
h1{margin:0;font-size:30px}
.home-link{color:var(--green-dark);font-weight:bold;text-decoration:none}
.filters{
    display:grid;
    grid-template-columns:minmax(200px,1fr) minmax(200px,1fr) minmax(220px,1fr);
    gap:16px;
    padding:20px 0;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
}
label{display:block;margin-bottom:7px;font-weight:bold}
input,select,textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #aebbc0;
    border-radius:4px;
    background:white;
    color:var(--ink);
    font:inherit;
}
.tabs{display:flex;gap:6px;margin:22px 0 0;border-bottom:1px solid var(--line)}
.tabs button{
    padding:11px 18px;
    border:0;
    border-bottom:3px solid transparent;
    background:transparent;
    color:var(--muted);
    font:inherit;
    font-weight:bold;
    cursor:pointer;
}
.tabs button[aria-selected="true"]{border-bottom-color:var(--green);color:var(--green-dark)}
#resourceList{min-height:150px}
.resource-card{padding:22px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.resource-card h2{margin:7px 0 12px;font-size:22px}
.resource-meta{color:var(--muted);font-size:14px}
.resource-content{line-height:1.6;margin:12px 0;overflow-wrap:anywhere}
.resource-card img{display:block;max-width:100%;height:auto;margin-top:12px}
.rich-content .rich-table-scroll{max-width:100%;overflow-x:auto}
.rich-content table{width:max-content;min-width:100%;border-collapse:collapse}
.rich-content th,.rich-content td{border:1px solid var(--line);padding:8px}
.rich-content th{background:#e8efeb}
.rich-content img{max-width:100%;height:auto}
.rich-content sup,.rich-content sub{line-height:normal}
.rich-content .katex-display{max-width:100%;overflow-x:auto;overflow-y:hidden}
.assignment-form{max-width:700px;margin-top:20px}
.assignment-form textarea{min-height:130px;resize:vertical}
.assignment-form input[type="file"]{padding:9px}
.field{margin-top:14px}
.primary-button{
    margin-top:16px;
    padding:12px 18px;
    border:0;
    border-radius:4px;
    background:var(--green);
    color:white;
    font:inherit;
    font-weight:bold;
    cursor:pointer;
}
.primary-button:hover{background:var(--green-dark)}
.saved-file{margin-top:10px}
.saved-file img{max-width:100%;max-height:360px}
.saved-file-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:12px}
.saved-file-details{min-width:0}
.selected-files{margin-top:12px}
.selected-file-list{display:grid;gap:10px;margin-top:8px}
.selected-file-item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.selected-file-details{min-width:0;overflow-wrap:anywhere}
.selected-file-details img{display:block;max-width:120px;max-height:100px;margin-top:6px}
.upload-status{min-height:1.5em;margin-top:12px;color:var(--muted)}
.remove-file-button{padding:5px 9px;border:1px solid #aebbc0;border-radius:4px;background:white;color:var(--ink);font:inherit;cursor:pointer}
.remove-file-button:hover{border-color:var(--green);color:var(--green-dark)}
.status{padding:24px 0;color:var(--muted)}
@media(max-width:700px){
    body{padding:16px}
    header{align-items:flex-start;flex-direction:column}
    h1{font-size:26px}
    .filters{grid-template-columns:1fr;gap:12px}
    .tabs button{flex:1;padding:11px 8px}
}
</style>
</head>
<body>
<main>
    <header>
        <h1>Notes &amp; Assignments</h1>
        <a class="home-link" href="index.html">Back to home</a>
    </header>

    <section class="filters" aria-label="Browse resources">
        <div>
            <label for="subjectFilter">Subject</label>
            <select id="subjectFilter"><option value="">All subjects</option></select>
        </div>
        <div>
            <label for="topicFilter">Topic</label>
            <select id="topicFilter"><option value="">All topics</option></select>
        </div>
        <div>
            <label for="studentName">Student name</label>
            <input id="studentName" type="text" autocomplete="name" placeholder="Enter your name to submit">
        </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Resource type">
        <button type="button" role="tab" aria-selected="true" onclick="showResourceTab('notes', this)">Notes</button>
        <button type="button" role="tab" aria-selected="false" onclick="showResourceTab('assignments', this)">Assignments</button>
    </div>
    <section id="resourceList" aria-live="polite" class="status">Loading resources...</section>
</main>
<script>
const subjectFilter = document.getElementById("subjectFilter");
const topicFilter = document.getElementById("topicFilter");
const studentNameField = document.getElementById("studentName");
const resourceList = document.getElementById("resourceList");
const commonSubjects = [
    "Account", "Agricultural Science", "Animal Husbandry", "Arabic", "Biology",
    "Book Keeping", "Business Studies", "Chemistry", "Christian Religious Studies",
    "Civic Education", "Commerce", "Computer Studies", "CRS", "Data Processing",
    "Economics", "Use of English", "English Language", "Financial Accounting", "Food and Nutrition",
    "Further Mathematics", "Geography", "Government", "History", "Home Economics",
    "Insurance", "Islamic Religious Studies", "Literature", "Literature in English",
    "Marketing", "Mathematics", "Music", "Physical and Health Education", "Physics",
    "Technical Drawing", "Visual Arts", "Yoruba"
];
let notes = [];
let assignments = [];
let activeTab = "notes";
let renderGeneration = 0;
const stagedAssignmentFiles = new Map();

function escapeHTML(value){
    return String(value || "").replace(/[&<>"']/g, character => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    })[character]);
}

function renderResourceContent(rawString, targetElement){
    try{
        if(typeof window.renderRichContent !== "function"){
            throw new Error("Rich-content renderer is unavailable");
        }
        window.renderRichContent(rawString, targetElement);
    }catch(error){
        console.error("Unable to render resource content", error);
        targetElement.textContent = String(rawString == null ? "" : rawString);
    }
}

function displaySubject(subject){
    return subject === "English" ? "Use of English" : subject;
}

function selectedResources(resources){
    const subject = subjectFilter.value;
    const topic = topicFilter.value;
    return resources.filter(resource =>
        (!subject || displaySubject(resource.subject) === subject) &&
        (!topic || (resource.topic || "General") === topic)
    );
}

function populateSubjects(){
    const selectedSubject = subjectFilter.value;
    const subjects = new Set(commonSubjects);
    [...notes, ...assignments].forEach(resource => {
        if(resource.subject) subjects.add(displaySubject(resource.subject));
    });
    subjectFilter.innerHTML = '<option value="">All subjects</option>';
    [...subjects].sort().forEach(subject => {
        const option = document.createElement("option");
        option.value = subject;
        option.textContent = subject;
        subjectFilter.appendChild(option);
    });
    subjectFilter.value = selectedSubject;
}

function updateTopics(){
    const selectedTopic = topicFilter.value;
    const subject = subjectFilter.value;
    const resources = [...notes, ...assignments].filter(resource => !subject || displaySubject(resource.subject) === subject);
    const topics = new Set(resources.map(resource => resource.topic || "General"));
    topicFilter.innerHTML = '<option value="">All topics</option>';
    [...topics].sort().forEach(topic => {
        const option = document.createElement("option");
        option.value = topic;
        option.textContent = topic;
        topicFilter.appendChild(option);
    });
    topicFilter.value = topics.has(selectedTopic) ? selectedTopic : "";
}

function showResourceTab(tab, button){
    activeTab = tab;
    document.querySelectorAll('[role="tab"]').forEach(tabButton => {
        tabButton.setAttribute("aria-selected", String(tabButton === button));
    });
    renderResources();
}

function renderResources(){
    const visibleResources = selectedResources(activeTab === "notes" ? notes : assignments);
    const generation = ++renderGeneration;
    if(!visibleResources.length){
        resourceList.className = "status";
        resourceList.textContent = activeTab === "notes" ? "No notes match these filters." : "No assignments match these filters.";
        return;
    }

    resourceList.className = "";
    resourceList.replaceChildren();
    const loading = document.createElement("div");
    loading.className = "status";
    loading.textContent = "Loading resources...";
    resourceList.appendChild(loading);
    let firstCardReady = false;

    function renderNextCard(index){
        if(generation !== renderGeneration) return;
        const resource = visibleResources[index];
        const isAssignment = activeTab === "assignments";
        const card = isAssignment ? `
            <article class="resource-card">
                <div class="resource-meta">${escapeHTML(displaySubject(resource.subject))} / ${escapeHTML(resource.topic || "General")}</div>
                <h2>${escapeHTML(resource.title)}</h2>
                <div class="resource-meta">${resource.dueDate ? `Due ${escapeHTML(new Date(resource.dueDate).toLocaleDateString())}` : "No due date"}</div>
                <div class="resource-content rich-content"></div>
                <div class="assignment-form">
                    <div class="field">
                        <label for="answer-${resource._id}">Your answer</label>
                        <textarea id="answer-${resource._id}" placeholder="Write an answer"></textarea>
                    </div>
                    <div class="field">
                        <label>Assignment files (optional)</label>
                        <input id="file-${resource._id}" type="file" accept="image/*,application/pdf" multiple hidden onchange="stageAssignmentFiles('${resource._id}', this)">
                        <button id="add-files-${resource._id}" class="primary-button" type="button" onclick="document.getElementById('file-${resource._id}').click()">Add files</button>
                    </div>
                    <div id="selected-files-${resource._id}" class="selected-files" hidden></div>
                    <div id="saved-file-${resource._id}" class="saved-file"></div>
                    <div id="upload-status-${resource._id}" class="upload-status" role="status" aria-live="polite"></div>
                    <button id="submit-${resource._id}" class="primary-button" type="button" onclick="submitStudentAssignment('${resource._id}')">Submit answer</button>
                </div>
            </article>
        ` : `
            <article class="resource-card">
                <div class="resource-meta">${escapeHTML(displaySubject(resource.subject))} / ${escapeHTML(resource.topic || "General")}</div>
                <h2>${escapeHTML(resource.title)}</h2>
                <div class="resource-content rich-content"></div>
                ${resource.image ? `<img src="${escapeHTML(resource.image)}" alt="">` : ""}
            </article>
        `;
        resourceList.insertAdjacentHTML("beforeend", card);
        const article = resourceList.lastElementChild;
        const contentElement = article.querySelector(".rich-content");
        renderResourceContent(isAssignment ? resource.instructions : resource.content, contentElement);
        if(isAssignment){
            renderStagedAssignmentFiles(resource._id);
            loadSavedStudentAnswers([resource]);
        }
        if(!firstCardReady){
            loading.remove();
            firstCardReady = true;
        }
        if(index + 1 < visibleResources.length){
            requestAnimationFrame(() => renderNextCard(index + 1));
        }
    }

    requestAnimationFrame(() => renderNextCard(0));
}

async function loadSavedStudentAnswers(visibleAssignments){
    const name = studentNameField.value.trim();
    if(!name) return;
    await Promise.all(visibleAssignments.map(async assignment => {
        try{
            const response = await fetch(`/assignments/${assignment._id}/submissions?studentKey=${encodeURIComponent(name)}`);
            const submissions = await response.json();
            if(!Array.isArray(submissions)) return;
            const answerField = document.getElementById(`answer-${assignment._id}`);
            const answerSubmission = submissions.find(submission => submission.answer);
            if(answerField && answerSubmission) answerField.value = answerSubmission.answer;
            const savedFile = document.getElementById(`saved-file-${assignment._id}`);
            if(savedFile){
                savedFile.innerHTML = submissions.map(submission => normalizeSubmissionFiles(submission).map(file => `
                        <div class="saved-file-item">
                            <div class="saved-file-details">
                                <a href="${escapeHTML(file.url)}" target="_blank" rel="noopener">${escapeHTML(file.name)}</a>
                                ${file.type && file.type.startsWith("image/") ? `<img src="${escapeHTML(file.url)}" alt="${escapeHTML(file.name)}">` : ""}
                            </div>
                            <button class="remove-file-button" type="button" onclick="removeStudentAssignmentFile('${assignment._id}', '${submission._id}', '${file.id}')">Remove</button>
                        </div>
                    `).join("")).join("");
            }
        }catch(error){
            console.log(error);
        }
    }));
}

function normalizeSubmissionFiles(submission){
    const files = (Array.isArray(submission.files) ? submission.files : []).map(file => ({
        id: file._id,
        url: file.url,
        name: file.originalName || "Uploaded file",
        type: file.fileType || ""
    }));
    if(submission.fileUrl){
        files.push({
            id: "legacy",
            url: submission.fileUrl,
            name: submission.fileName || "Uploaded file",
            type: submission.fileType || ""
        });
    }
    return files;
}

function renderStagedAssignmentFiles(assignmentId){
    const selectedFiles = stagedAssignmentFiles.get(assignmentId) || [];
    const container = document.getElementById(`selected-files-${assignmentId}`);
    const addButton = document.getElementById(`add-files-${assignmentId}`);
    container.hidden = selectedFiles.length === 0;
    addButton.textContent = selectedFiles.length ? "Add more files" : "Add files";
    container.innerHTML = selectedFiles.length ? `
        <strong>Selected files</strong>
        <div class="selected-file-list">${selectedFiles.map((item, index) => `
            <div class="selected-file-item">
                <div class="selected-file-details">
                    ${escapeHTML(item.file.name)}
                    ${item.previewUrl ? `<img src="${escapeHTML(item.previewUrl)}" alt="Preview of ${escapeHTML(item.file.name)}">` : ""}
                </div>
                <button class="remove-file-button" type="button" onclick="removeStagedAssignmentFile('${assignmentId}', ${index})">Remove</button>
            </div>
        `).join("")}</div>
    ` : "";
}

function stageAssignmentFiles(assignmentId, input){
    const incomingFiles = Array.from(input.files);
    input.value = "";
    const selectedFiles = stagedAssignmentFiles.get(assignmentId) || [];
    if(selectedFiles.length + incomingFiles.length > 10){
        alert("You can submit up to 10 files at a time.");
        return;
    }
    const invalidFile = incomingFiles.find(file => !file.type.startsWith("image/") && file.type !== "application/pdf");
    if(invalidFile){
        alert(`\"${invalidFile.name}\" is not an image or PDF. Choose image files or PDFs only.`);
        return;
    }
    const oversizedFile = incomingFiles.find(file => file.size > 10 * 1024 * 1024);
    if(oversizedFile){
        alert(`\"${oversizedFile.name}\" is larger than 10 MB. Each file must be 10 MB or smaller.`);
        return;
    }
    incomingFiles.forEach(file => selectedFiles.push({
        file,
        previewUrl: file.type.startsWith("image/") ? URL.createObjectURL(file) : ""
    }));
    stagedAssignmentFiles.set(assignmentId, selectedFiles);
    renderStagedAssignmentFiles(assignmentId);
}

function removeStagedAssignmentFile(assignmentId, index){
    const selectedFiles = stagedAssignmentFiles.get(assignmentId) || [];
    const [removedFile] = selectedFiles.splice(index, 1);
    if(removedFile && removedFile.previewUrl) URL.revokeObjectURL(removedFile.previewUrl);
    stagedAssignmentFiles.set(assignmentId, selectedFiles);
    renderStagedAssignmentFiles(assignmentId);
}

async function submitStudentAssignment(assignmentId){
    const name = studentNameField.value.trim();
    const answerField = document.getElementById(`answer-${assignmentId}`);
    const selectedFiles = stagedAssignmentFiles.get(assignmentId) || [];
    const answer = answerField.value.trim();
    if(!name){
        alert("Enter your name before submitting");
        studentNameField.focus();
        return;
    }
    if(!answer && !selectedFiles.length){
        alert("Write an answer or choose an image/PDF file");
        return;
    }

    const formData = new FormData();
    formData.append("studentName", name);
    formData.append("studentKey", name);
    formData.append("answer", answer);
    selectedFiles.forEach(item => formData.append("files", item.file));
    const submitButton = document.getElementById(`submit-${assignmentId}`);
    const addButton = document.getElementById(`add-files-${assignmentId}`);
    const uploadStatus = document.getElementById(`upload-status-${assignmentId}`);
    submitButton.disabled = true;
    addButton.disabled = true;
    uploadStatus.textContent = "Uploading...";
    try{
        const response = await fetch(`/assignments/${assignmentId}/submissions`, {
            method:"POST",
            body:formData
        });
        const result = await response.json();
        if(!response.ok || !result.success) throw new Error(result.message || "Submission failed");
        localStorage.setItem("candidateName", name);
        selectedFiles.forEach(item => {
            if(item.previewUrl) URL.revokeObjectURL(item.previewUrl);
        });
        stagedAssignmentFiles.set(assignmentId, []);
        renderStagedAssignmentFiles(assignmentId);
        await loadSavedStudentAnswers(assignments.filter(assignment => assignment._id === assignmentId));
        uploadStatus.textContent = "Submission uploaded successfully.";
    }catch(error){
        console.log(error);
        uploadStatus.textContent = "Upload failed. Your selected files are still available to retry.";
        alert(error.message || "Unable to submit your answer");
    }finally{
        submitButton.disabled = false;
        addButton.disabled = false;
    }
}

async function removeStudentAssignmentFile(assignmentId, submissionId, fileId){
    const name = studentNameField.value.trim();
    if(!name){
        alert("Enter your name before removing an upload");
        studentNameField.focus();
        return;
    }
    if(!confirm("Remove this uploaded file?")) return;

    try{
        const response = await fetch(`/assignments/${assignmentId}/submissions/${submissionId}/files/${fileId}`, {
            method:"DELETE",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({studentKey:name})
        });
        const result = await response.json();
        if(!response.ok || !result.success) throw new Error(result.message || "Unable to remove this file");
        await loadSavedStudentAnswers(assignments.filter(assignment => assignment._id === assignmentId));
    }catch(error){
        console.log(error);
        alert(error.message || "Unable to remove this file");
    }
}

subjectFilter.addEventListener("change", () => {
    updateTopics();
    renderResources();
});
topicFilter.addEventListener("change", renderResources);
studentNameField.addEventListener("change", () => {
    if(activeTab === "assignments") renderResources();
});

async function loadResources(){
    try{
        const [notesResponse, assignmentsResponse] = await Promise.all([
            fetch("/formulas"),
            fetch("/assignments")
        ]);
        if(!notesResponse.ok || !assignmentsResponse.ok) throw new Error("Unable to load resources");
        notes = await notesResponse.json();
        assignments = await assignmentsResponse.json();
        populateSubjects();
        updateTopics();
        renderResources();
    }catch(error){
        console.log(error);
        resourceList.className = "status";
        resourceList.textContent = "Unable to load resources.";
    }
}

studentNameField.value = localStorage.getItem("candidateName") || "";
document.addEventListener("DOMContentLoaded", loadResources, { once:true });
</script>
</body>
</html>
