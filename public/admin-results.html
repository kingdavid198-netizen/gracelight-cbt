<!DOCTYPE html>
<html>
<head>
<title>Admin Results</title>

<style>
body{
font-family:Arial;
background:#f4f7ff;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
border:1px solid #ccc;
padding:12px;
text-align:center;
}

th{
background:#2563eb;
color:white;
}

tr:nth-child(even){
background:#f9f9f9;
}
</style>
</head>

<body>

<div class="container">

<h1>All Candidates Results</h1>

<table>
<thead>
<tr>
<th>Candidate</th>
<th>Subject</th>
<th>Topic</th>
<th>Score</th>
<th>Percentage</th>
<th>Remark</th>
<th>Date</th> 
<th>Action</th>
</tr>
</thead>

<tbody id="resultsBody">

</tbody>
</table>

</div>

<script>

async function loadResults() {

const resultsBody =
document.getElementById("resultsBody");

resultsBody.innerHTML = "";

try {

const response = await fetch("/results");

const allResults = await response.json();

if(allResults.length === 0){

resultsBody.innerHTML = `
<tr>
<td colspan="8">No Results Found</td>
</tr>
`;

}else{

allResults.forEach(result => {

resultsBody.innerHTML += `
<tr>
<td>${result.candidateName || "N/A"}</td>
<td>${result.subject || "N/A"}</td>
<td>${result.topic || "N/A"}</td>
<td>${result.score || 0}/${result.totalQuestions || 0}</td>
<td>${result.percentage || 0}%</td>
<td>${result.remark || "N/A"}</td>
<td>${result.date || "N/A"}</td>

<td>
<button onclick="deleteResult('${result._id}')"
style="
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
">
Delete
</button>
</td>

</tr>
`;

});

}

} catch(error){

console.log(error);

resultsBody.innerHTML = `
<tr>
<td colspan="8">Error Loading Results</td>
</tr>
`;

}

}

async function deleteResult(id){

const confirmDelete =
confirm("Are you sure you want to delete this result?");

if(!confirmDelete){
return;
}

try{

const response =
await fetch(`/delete-result/${id}`, {
method:"DELETE"
});

const data = await response.json();

if(data.success){

alert("Result deleted successfully");

loadResults();

}else{

alert("Failed to delete result");

}

}catch(error){

console.log(error);

alert("Error deleting result");

}

}

loadResults();

</script>

</body>
</html>
