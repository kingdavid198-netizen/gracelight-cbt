<!DOCTYPE html>
<html>
<head>
<title>Admin Results</title>

<style>
body{
font-family:Arial;
background:#f4f7ff;
padding:20px;
}

.container{
max-width:1100px;
margin:auto;
background:white;
padding:20px;
border-radius:12px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th, td{
border:1px solid #ccc;
padding:12px;
text-align:center;
}

th{
background:#2563eb;
color:white;
}

tr:nth-child(even){
background:#f9f9f9;
}
</style>
</head>

<body>

<div class="container">

<div class="admin-tabs">
    <button id="showResultsBtn" class="active-tab">
        📊 Results
    </button>

    <button id="showFormulaBtn">
        📘 Formula Manager
    </button>
</div>

<h1 id="pageTitle">All Candidates Results</h1>
<div id="resultsSection">
<table>
<thead>
<tr>
<th>Candidate</th>
<th>Subject</th>
<th>Topic</th>
<th>Score</th>
<th>Percentage</th>
<th>Remark</th>
<th>Date</th> 
<th>Action</th>
</tr>
</thead>

<tbody id="resultsBody">

</tbody>
</table>

</div>

<div id="formulaSection" style="display:none;">

    <select id="formulaSubject">

    <option value="Agricultural Science">Agricultural Science</option>

    <option value="Animal Husbandry">Animal Husbandry</option>

    <option value="Arabic">Arabic</option>

    <option value="Biology">Biology</option>

    <option value="Book Keeping">Book Keeping</option>

    <option value="Business Studies">Business Studies</option>

    <option value="Chemistry">Chemistry</option>

    <option value="Christian Religious Studies">Christian Religious Studies</option>

    <option value="Civic Education">Civic Education</option>

    <option value="Commerce">Commerce</option>

    <option value="Computer Studies">Computer Studies</option>

    <option value="Data Processing">Data Processing</option>

    <option value="Economics">Economics</option>

    <option value="English Language">English Language</option>

    <option value="Financial Accounting">Financial Accounting</option>

    <option value="Food and Nutrition">Food and Nutrition</option>

    <option value="Further Mathematics">Further Mathematics</option>

    <option value="Geography">Geography</option>

    <option value="Government">Government</option>

    <option value="History">History</option>

    <option value="Home Economics">Home Economics</option>

    <option value="Insurance">Insurance</option>

    <option value="Islamic Religious Studies">Islamic Religious Studies</option>

    <option value="Literature in English">Literature in English</option>

    <option value="Marketing">Marketing</option>

    <option value="Mathematics">Mathematics</option>

    <option value="Music">Music</option>

    <option value="Physical and Health Education">Physical and Health Education</option>

    <option value="Physics">Physics</option>

    <option value="Technical Drawing">Technical Drawing</option>

    <option value="Visual Arts">Visual Arts</option>

    <option value="Yoruba">Yoruba</option>

</select>

    <br><br>

    <input
        type="text"
        id="formulaTitle"
        placeholder="Formula Title"
        style="width:100%;padding:10px;"
    >

    <input
    type="file"
    id="formulaImage"
    accept="image/*"
 >

    <br><br>

    <textarea
        id="formulaContent"
        placeholder="Enter Formula"
        rows="5"
        style="width:100%;padding:10px;"
    ></textarea>

    <br><br>

    <button id="saveFormulaBtn">
        Save Formula
    </button>

    <hr>

    <div id="formulaList"></div>

</div>  

<script>

document.getElementById("showResultsBtn").onclick = function () {

    document.getElementById("resultsSection").style.display = "block";

    document.getElementById("formulaSection").style.display = "none";

    document.getElementById("pageTitle").innerText =
        "All Candidates Results";

};

document.getElementById("showFormulaBtn").onclick = function () {

    document.getElementById("resultsSection").style.display = "none";

    document.getElementById("formulaSection").style.display = "block";

    document.getElementById("pageTitle").innerText =
        "Formula Manager";

};  

async function loadResults() {

const resultsBody =
document.getElementById("resultsBody");

resultsBody.innerHTML = "";

try {

const response = await fetch("/results");

const allResults = await response.json();

if(allResults.length === 0){

resultsBody.innerHTML = `
<tr>
<td colspan="8">No Results Found</td>
</tr>
`;

}else{

allResults.forEach(result => {

resultsBody.innerHTML += `
<tr>
<td>${result.candidateName || "N/A"}</td>
<td>${result.subject || "N/A"}</td>
<td>${result.topic || "N/A"}</td>
<td>${result.score || 0}/${result.totalQuestions || 0}</td>
<td>${result.percentage || 0}%</td>
<td>${result.remark || "N/A"}</td>
<td>${result.date || "N/A"}</td>

<td>
<button onclick="deleteResult('${result._id}')"
style="
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:5px;
cursor:pointer;
">
Delete
</button>
</td>

</tr>
`;

});

}

} catch(error){

console.log(error);

resultsBody.innerHTML = `
<tr>
<td colspan="8">Error Loading Results</td>
</tr>
`;

}

}

async function deleteResult(id){

const confirmDelete =
confirm("Are you sure you want to delete this result?");

if(!confirmDelete){
return;
}

try{

const response =
await fetch(`/delete-result/${id}`, {
method:"DELETE"
});

const data = await response.json();

if(data.success){

alert("Result deleted successfully");

loadResults();

}else{

alert("Failed to delete result");

}

}catch(error){

console.log(error);

alert("Error deleting result");

}

}

loadResults();

document.getElementById("saveFormulaBtn")
.onclick = async function () {

    const subject =
        document.getElementById("formulaSubject").value;

    const title =
        document.getElementById("formulaTitle").value;

    const content =
        document.getElementById("formulaContent").value;

    if (!title || !content) {

        alert("Please enter formula title and content");

        return;

    }

    try {

        const response = await fetch("/formulas", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                subject,
                title,
                content
            })

        });

        const result = await response.json();

        if (result.success) {

            alert("Formula Saved Successfully");

            document.getElementById("formulaTitle").value = "";

            document.getElementById("formulaContent").value = "";

            loadFormulas();

        }

    } catch (error) {

        console.log(error);

        alert("Error Saving Formula");

    }

};

    async function loadFormulas() {

    const formulaList =
        document.getElementById("formulaList");

    formulaList.innerHTML = "";

    try {

        const response =
            await fetch("/formulas");

        const formulas =
            await response.json();

        formulas.forEach(formula => {

            formulaList.innerHTML += `

                <div style="
                    border:1px solid #ddd;
                    padding:15px;
                    margin-bottom:10px;
                    border-radius:8px;
                ">

                    <b>${formula.subject}</b>

                    <h3>${formula.title}</h3>

                    <p>${formula.content}</p>

                    <button
                        onclick="deleteFormula('${formula._id}')"
                    >
                        Delete
                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.log(error);

    }

}

    async function deleteFormula(id) {

    if (!confirm("Delete this formula?")) {

        return;

    }

    await fetch(`/formulas/${id}`, {
    method: "DELETE"
});

    loadFormulas();

}

    loadFormulas();

</script>

</body>
</html>
