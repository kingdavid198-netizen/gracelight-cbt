<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>

body{
    font-family:Arial;
    background:#f4f7ff;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.login-box{
    background:white;
    width:350px;
    padding:40px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    text-align:center;
}

h1{
    color:#2563eb;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.error{
    color:red;
    margin-top:15px;
}

</style>

</head>

<body>

<div class="login-box">

<h1>Admin Login</h1>

<input type="text"
id="username"
placeholder="Enter Username">

<input type="password"
id="password"
placeholder="Enter Password">

<button onclick="loginAdmin()">
Login
</button>

<p class="error" id="error"></p>

</div>

<script>

function loginAdmin(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

if(
username === "kingdave"
&&
password === "AYOdeji1975#"
){

window.location.href =
"admin-results.html";

}else{

document.getElementById("error").innerHTML =
"Invalid Admin Login";

}

}

</script>

</body>
</html>
