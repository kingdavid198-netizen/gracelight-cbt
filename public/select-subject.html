<!DOCTYPE html>
<html>
<head>
<title>GraceLight CBT - Subject Selection</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
background:#f2f2f2;
padding:30px;
}

.container{
width:95%;
max-width:500px;
margin:40px auto;
background:white;
padding:40px 25px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
min-height:75vh;
}

h1{
text-align:center;
color:darkblue;
}

label{
font-weight:bold;
display:block;
margin-top:15px;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
font-size:16px;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:15px;
margin-top:25px;
background:darkblue;
color:white;
border:none;
font-size:18px;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:green;
}

.passport-message{
margin:8px 0 0;
color:#b42318;
font-size:14px;
}

.passport-message:empty{
display:none;
}

.passport-message[data-state="success"]{
color:#176b35;
}

  @media(max-width:768px){

body{
min-height:100vh;
padding:15px;
}

.container{
width:100%;
max-width:100%;
padding:30px 20px;
box-sizing:border-box;
margin:20px auto;
min-height:85vh;
border-radius:0;
}

h1{
font-size:32px;
}

input, select{
font-size:15px;
padding:12px;
}

button{
padding:12px;
font-size:16px;
margin-top:18px;
}

}
</style>
</head>

<body>

<script>
if(localStorage.getItem("examAuthorized") !== "true"){
    alert("Access Denied! Please enter a valid exam PIN.");
    window.location.href = "login.html";
}
</script>  

<div class="container">

<h1>GraceLight CBT</h1>

<label>Candidate Name</label>
<input type="text" id="name">

<label>Passport Photograph</label>

<input
type="file"
id="passport"
accept="image/*"
>
<p id="passportMessage" class="passport-message" role="status" aria-live="polite"></p>

<label>Select Subject</label>
<select id="subject">
<option value="">-- Select Subject --</option>
<option>Account</option>
<option>Biology</option>
<option>Chemistry</option>
<option>Commerce</option>
<option>CRS</option>
<option>Economics</option>
<option>English</option>
<option>Government</option>
<option>Literature</option>
<option>Mathematics</option>
<option>Physics</option>
</select>

<label>Select Topic</label>
<select id="topic">
<option value="">-- Select Topic --</option>
</select>

<button onclick="startExam()">Start Exam</button>

</div>

<script>

localStorage.removeItem("candidatePassport");

const subjectSelect = document.getElementById("subject");
const topicSelect = document.getElementById("topic");
const passportInput = document.getElementById("passport");
const passportMessage = document.getElementById("passportMessage");
const maxPassportFileSize = 15 * 1024 * 1024;

function showPassportMessage(message, state = "error") {
    passportMessage.textContent = message;
    passportMessage.dataset.state = state;
}

function validatePassportFile(file) {
    if (!file.type || !file.type.startsWith("image/")) {
        return "Choose an image file for the passport photo.";
    }
    if (file.size > maxPassportFileSize) {
        return "Passport photo must be 15 MB or smaller before resizing.";
    }
    return "";
}

passportInput.addEventListener("change", () => {
    const file = passportInput.files[0];
    if (!file) {
        showPassportMessage("");
        return;
    }
    const validationMessage = validatePassportFile(file);
    if (validationMessage) {
        passportInput.value = "";
        showPassportMessage(validationMessage);
        return;
    }
    showPassportMessage("Image selected. It will be resized before upload.", "success");
});

subjectSelect.addEventListener("change", async ()=>{

const subject = subjectSelect.value;

if(subject===""){
topicSelect.innerHTML =
'<option value="">-- Select Topic --</option>';
return;
}

topicSelect.innerHTML =
'<option value="">Loading topics...</option>';

try{

const response = await fetch(`/topics/${subject}`);

const topics = await response.json();

topicSelect.innerHTML =
'<option value="">-- Select Topic --</option>';

if(topics.length===0){

topicSelect.innerHTML +=
'<option value="">No Topics Found</option>';

return;
}

topics.forEach(topic => {

topicSelect.innerHTML +=
`<option value="${topic}">
${topic}
</option>`;

});

}catch(error){
alert("Error loading topics");
}

});

async function startExam(){

const name = document.getElementById("name").value.trim();
const subject = document.getElementById("subject").value;
const topic = document.getElementById("topic").value;

if(name==="" || subject==="" || topic===""){
alert("Please fill all fields");
return;
}

const studentKey = name.toLowerCase().replace(/\s+/g, " ");
const previousStudentKey = localStorage.getItem("candidatePhotoActiveStudentKey");
if(previousStudentKey && previousStudentKey !== studentKey){
localStorage.removeItem(`candidatePassport:${previousStudentKey}`);
localStorage.removeItem(`candidatePhotoId:${previousStudentKey}`);
}
localStorage.removeItem("candidatePassport");
localStorage.setItem("candidatePhotoActiveStudentKey", studentKey);

localStorage.removeItem("examTime");
localStorage.removeItem("exitCount");
localStorage.removeItem("examFlagCount");

try {
    const response = await fetch(`/exam-config/${encodeURIComponent(subject)}/${encodeURIComponent(topic)}`);
    const config = await response.json();
    const durationMinutes = Number(config && config.durationMinutes ? config.durationMinutes : 30);
    const graceSeconds = Number(config && Number.isFinite(Number(config.graceSeconds)) ? Number(config.graceSeconds) : 10);
    const maxFlagsBeforeAutoSubmit = Number(config && Number.isFinite(Number(config.maxFlagsBeforeAutoSubmit)) ? Number(config.maxFlagsBeforeAutoSubmit) : 0);
    const showWarnings = config && typeof config.showWarnings === "boolean" ? config.showWarnings : true;
    localStorage.setItem("examDurationMinutes", String(durationMinutes));
    localStorage.setItem("examConfig", JSON.stringify({ graceSeconds, maxFlagsBeforeAutoSubmit, showWarnings }));
} catch (error) {
    console.log(error);
    localStorage.setItem("examDurationMinutes", "30");
    localStorage.setItem("examConfig", JSON.stringify({ graceSeconds: 10, maxFlagsBeforeAutoSubmit: 0, showWarnings: true }));
}

const file =
passportInput.files[0];

if(file){
const validationMessage = validatePassportFile(file);
if (validationMessage) {
    showPassportMessage(validationMessage);
    return;
}

try {
    const dataUrl = await resizeCandidatePhoto(file);
    const response = await fetch("/candidate-photo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentKey, dataUrl })
    });
    const result = await response.json();
    if (!response.ok || !result.photoId) {
        throw new Error(result.message || `Photo upload failed (HTTP ${response.status})`);
    }
    localStorage.setItem(`candidatePassport:${studentKey}`, dataUrl);
    localStorage.setItem(`candidatePhotoId:${studentKey}`, result.photoId);
    showPassportMessage("");
} catch (error) {
    console.error("Unable to prepare candidate photo:", error);
    showPassportMessage(error.message || "The passport image could not be decoded or uploaded. Please try again.");
    return;
}
} else {
    showPassportMessage("");
}

localStorage.setItem("candidateName", name);
localStorage.setItem("subject", subject);
localStorage.setItem("topic", topic);
window.location.href = "exam.html";
}

async function resizeCandidatePhoto(file) {
    let image;
    let objectUrl;
    try {
        if (typeof createImageBitmap === "function") {
            try {
                image = await createImageBitmap(file, { imageOrientation: "from-image" });
            } catch (error) {
                image = null;
            }
        }

        if (!image) {
            objectUrl = URL.createObjectURL(file);
            image = await new Promise((resolve, reject) => {
                const element = new Image();
                element.onload = () => resolve(element);
                element.onerror = () => reject(new Error("The selected photo could not be decoded"));
                element.src = objectUrl;
            });
        }

        const canvas = document.createElement("canvas");
        canvas.width = 300;
        canvas.height = 300;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Photo resizing is unavailable in this browser");

        const scale = Math.max(300 / image.width, 300 / image.height);
        const sourceWidth = 300 / scale;
        const sourceHeight = 300 / scale;
        context.drawImage(
            image,
            (image.width - sourceWidth) / 2,
            (image.height - sourceHeight) / 2,
            sourceWidth,
            sourceHeight,
            0,
            0,
            300,
            300
        );
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        const base64 = dataUrl.split(",")[1];
        if (atob(base64).length > 100 * 1024) {
            throw new Error("The resized passport photo is still larger than 100KB");
        }
        return dataUrl;
    } finally {
        if (image && typeof image.close === "function") image.close();
        if (objectUrl) URL.revokeObjectURL(objectUrl);
    }
}

</script>

</body>
</html>
